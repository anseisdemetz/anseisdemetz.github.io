<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>La balle</title>
	<style>
		canvas{
			border: 3px solid #333333;
		}
	</style>
</head>
<body>

	<canvas id="myCanvas" width="600" height="350"></canvas>

	<script src="paddle.js"></script>

	<script>

		class Balle{

			constructor(x = 20, y = 20, rayon = 10, vitesse = 1, couleur = "#333333"){
				this.x = x;
				this.y = y;
				this.rayon = rayon;
				this.couleur = couleur;

				// const angleRadian = angleDegres * (Math.PI/180);
				const angleRadian = Math.random() * Math.PI * 2;
				this.dx = vitesse * Math.cos(angleRadian);
				this.dy = vitesse * Math.sin(angleRadian);
				this.initPositionBalle();
			}

			initPositionBalle(){
				this.x = canvas.width/2;
				this.y = canvas.height/2;
			}

			dessiner(){
				ctx.beginPath();
			    ctx.arc(this.x, this.y, this.rayon, 0, Math.PI * 2);
			    ctx.fillStyle = this.couleur;
			    ctx.fill();
			    ctx.closePath();
			}

			logique(){
				if(this.x + this.rayon > canvas.width || this.x - this.rayon < 0) this.dx = -this.dx;
				if(this.y + this.rayon > canvas.height || this.y - this.rayon < 0) this.dy = -this.dy;

				this.x += this.dx;
				this.y += this.dy;
			}

			verifierCollisionPaddle(paddle) {
			    // 1. Trouver les coordonnées du point du paddle le plus proche de la balle
			    const closestX = Math.max(paddle.x, Math.min(this.x, paddle.x + paddle.width));
			    const closestY = Math.max(paddle.y, Math.min(this.y, paddle.y + paddle.height));

			    // 2. Calculer la distance entre le centre de la balle et ce point
			    const distanceX = this.x - closestX;
			    const distanceY = this.y - closestY;
			    const distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

			    // 3. Tester si la distance est inférieure au carré du rayon
			    if (distanceSquared < (this.rayon * this.rayon)) {
			      
			      // Inverser la direction verticale
			      this.dy = -Math.abs(this.dy); // Va toujours vers le haut après un impact avec le paddle

			      // Éviter que la balle ne reste "collée" dans le paddle
			      this.y = paddle.y - this.rayon;

			      // Bonus : Ajuster l'angle de rebond en fonction de l'endroit où la balle touche le paddle
			      const centrePaddle = paddle.x + (paddle.width / 2);
			      const impactRelative = (this.x - centrePaddle) / (paddle.width / 2); // Entre -1 (gauche) et 1 (droite)
			      
			      // Fait varier la vitesse horizontale `dx` selon le point de contact
			      this.dx = impactRelative * 5; 
			    }
			}

			verifierCollisionBalle(autreBalle) {
			  // 1. Calcul des distances sur les axes X et Y
			  const dx = autreBalle.x - this.x;
			  const dy = autreBalle.y - this.y;
			  
			  // Distance au carré (Théorème de Pythagore : a² + b² = c²)
			  const distanceSquared = dx * dx + dy * dy;
			  
			  // Somme des deux rayons
			  const rayonTotal = this.rayon + autreBalle.rayon;

			  // 2. Test de collision
			  if (distanceSquared < rayonTotal * rayonTotal) {
			    
			    // Rebond simple : échanger leurs directions/vitesses
			    const tempDx = this.dx;
			    const tempDy = this.dy;

			    this.dx = autreBalle.dx;
			    this.dy = autreBalle.dy;

			    autreBalle.dx = tempDx;
			    autreBalle.dy = tempDy;

			    // 3. Empêcher les balles de s'encastrer l'une dans l'autre
			    const distance = Math.sqrt(distanceSquared);
			    const chevauchement = (rayonTotal - distance) / 2;
			    
			    // Éloigner légèrement les balles sur l'axe de l'impact
			    this.x -= (dx / distance) * chevauchement;
			    this.y -= (dy / distance) * chevauchement;
			    autreBalle.x += (dx / distance) * chevauchement;
			    autreBalle.y += (dy / distance) * chevauchement;
			  }
			}

			verifierCollisionBriques(modele, briques) {
			    for (let i = 0; i < briques.length; i++) {
			      const brique = briques[i];

			      // On ne teste que les briques qui sont encore vivantes/visibles
			      if (brique.active !== false) {

			        // Point de la brique le plus proche du centre de la balle
			        const closestX = Math.max(brique.x, Math.min(this.x, brique.x + brique.width));
			        const closestY = Math.max(brique.y, Math.min(this.y, brique.y + brique.height));

			        // Distance entre le centre de la balle et ce point
			        const distanceX = this.x - closestX;
			        const distanceY = this.y - closestY;
			        const distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);

			        // Détection du contact
			        if (distanceSquared < (this.rayon * this.rayon)) {
			          // 1. Marquer la brique comme détruite
			          briques.splice(i, 1);
			          brique.active = false;
			          modele[brique.i][brique.j] = 0;

			          // 2. Faire rebondir la balle
			          this.dy = -this.dy;

			          // Une seule collision traitée par frame pour éviter les rebonds multiples bizarres
			          break; 
			        }
			      }
			    }
			  }
		}
		
		const canvas = document.getElementById('myCanvas');
		const ctx = canvas.getContext('2d');

		const balle = new Balle(20, 20, 10, 5, "#333333");
		const balle2 = new Balle(20, 20, 10, 7, "#990000");
		const paddle = new Paddle(canvas, 60, 15, "#333333", 8);
		paddle.eventListener();

		function scene(){

			balle.dessiner();
			balle.logique();
			balle.verifierCollisionBalle(balle2);
			balle.verifierCollisionPaddle(paddle);
			
			balle2.dessiner();
			balle2.logique();
			balle2.verifierCollisionBalle(balle);
			balle2.verifierCollisionPaddle(paddle);

			paddle.dessiner();
			paddle.logique();

		}

		function boucle(){
			ctx.clearRect(0, 0, canvas.width, canvas.height);

			scene();

			requestAnimationFrame(boucle);
		}

		boucle();

	</script>

</body>
</html>
