<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Analyse Argus Produit — Comparecycle</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function TimelineApp() {
      const [data09, setData09] = useState([]);
      const [selectedId, setSelectedId] = useState("44888");
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedGrade, setSelectedGrade] = useState("A");
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);

      const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_api_key") || "");
      const [aiAnalysis, setAiAnalysis] = useState(null);
      const [loadingAi, setLoadingAi] = useState(false);
      const [newProductHistory, setNewProductHistory] = useState([]);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const dropdownRef = useRef(null);
      const inputRef = useRef(null);

      const gradesList = ["A", "B", "C", "D-"];
      const targetHorizons = [3, 6, 12, 24, 36];
      const targetHorizonLabels = ["+3M", "+6M", "+12M", "+24M", "+36M"];
      const allMonths = Array.from({ length: 37 }, (_, i) => `M${i}`);

      const buyersList = [
        { key: "orange", label: "Orange", domain: "boutique.orange.fr" },
        { key: "backmarket", label: "Back Market", domain: "backmarket.fr" },
        { key: "apple_likewize", label: "Apple Trade In", domain: "fr-appletradein.likewize.com" },
        { key: "vendremonmobile", label: "VendreMonMobile", domain: "vendremonmobile.com" },
        { key: "envirofone", label: "Envirofone", domain: "envirofone.com" }
      ];

      const handleApiKeyChange = (e) => {
        const key = e.target.value;
        setApiKey(key);
        localStorage.setItem("gemini_api_key", key);
      };

      useEffect(() => {
        fetch("timeline_data_09.json")
          .then((res) => res.json())
          .then((data) => {
            setData09(data);
            const defaultProd = data.find((p) => p.idproduct === "44888");
            if (defaultProd) {
              setSearchTerm(`${defaultProd.product} (${defaultProd.idproduct})`);
            }
          })
          .catch(() => setData09([]));
      }, []);

      const productsList = useMemo(() => {
        const uniqueMap = new Map();
        data09.forEach((item) => {
          if (!uniqueMap.has(item.idproduct)) {
            uniqueMap.set(item.idproduct, {
              id: item.idproduct,
              name: item.product,
              brand: item.manufacturer,
              launchDate: item.launch_date
            });
          }
        });
        return Array.from(uniqueMap.values()).sort((a, b) => new Date(a.launchDate) - new Date(b.launchDate));
      }, [data09]);

      const filteredProducts = useMemo(() => {
        if (!searchTerm.trim()) return productsList;
        const selectedProd = productsList.find((p) => p.id === selectedId);
        const selectedString = selectedProd ? `${selectedProd.name} (${selectedProd.id})` : "";
        if (searchTerm === selectedString) return productsList;

        const term = searchTerm.toLowerCase();
        return productsList.filter(
          (p) => p.name.toLowerCase().includes(term) || p.id.toLowerCase().includes(term)
        );
      }, [productsList, searchTerm, selectedId]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsDropdownOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const currentItem = useMemo(() => {
        return data09.find((i) => i.idproduct === selectedId && i.grade === selectedGrade) || null;
      }, [data09, selectedId, selectedGrade]);

      useEffect(() => {
        if (!selectedId) return;
        const storageKey = `new_price_db_${selectedId}_${selectedGrade}`;
        const saved = localStorage.getItem(storageKey);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setNewProductHistory(parsed.history || []);
            setAiAnalysis(parsed.analysis || null);
          } catch (e) {
            setNewProductHistory([]);
          }
        } else {
          setNewProductHistory([]);
          setAiAnalysis(null);
        }
      }, [selectedId, selectedGrade]);

      // Analyse spécifique aux 5 vitrines de rachat
      const analyzeWithGemini = async () => {
        if (!apiKey) {
          alert("Veuillez saisir votre clé API Gemini.");
          return;
        }
        if (!currentItem) return;

        setLoadingAi(true);

        const prompt = `
Effectue une recherche sur le web pour trouver l'offre de reprise / trade-in ACTUELLE à date en France pour ce smartphone :
- Produit : ${currentItem.product}
- Grade / État : Grade ${currentItem.grade}
- Prix de lancement P0 : ${currentItem.p0} €

Cherche spécifiquement l'offre de rachat actuelle pour les 5 vitrines de repreneurs suivantes :
1. boutique.orange.fr (Orange Reprise)
2. backmarket.fr (Back Market Reprise)
3. fr-appletradein.likewize.com (Apple Trade In / Likewize)
4. vendremonmobile.com (VendreMonMobile)
5. envirofone.com (Envirofone)

Cherche également le prix du produit NEUF actuel sur le marché et l'historique estimé des prix du neuf de M0 à M36.

Donne une réponse sous forme d'un objet JSON strict (sans balises markdown) :
{
  "buyers": {
    "orange": <prix_de_reprise_en_nombre_ou_null>,
    "backmarket": <prix_de_reprise_en_nombre_ou_null>,
    "apple_likewize": <prix_de_reprise_en_nombre_ou_null>,
    "vendremonmobile": <prix_de_reprise_en_nombre_ou_null>,
    "envirofone": <prix_de_reprise_en_nombre_ou_null>
  },
  "current_new_price": <prix_actuel_produit_neuf_en_nombre>,
  "ai_projection_text": "<courte synthèse indiquant les sources trouvées>",
  "estimated_new_price_curve": [<tableau_de_37_nombres_representant_le_prix_du_produit_neuf_de_M0_a_M36>]
}
        `;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              tools: [{ google_search: {} }]
            })
          });

          const data = await response.json();
          const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
          const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
          
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            setAiAnalysis(parsed);

            const curve = parsed.estimated_new_price_curve || [];
            setNewProductHistory(curve);

            const storageKey = `new_price_db_${selectedId}_${selectedGrade}`;
            localStorage.setItem(storageKey, JSON.stringify({
              analysis: parsed,
              history: curve,
              updatedAt: new Date().toISOString()
            }));
          } else {
            alert("Erreur lors de la structuration des données des repreneurs.");
          }
        } catch (err) {
          alert("Erreur lors de la recherche web.");
        }
        setLoadingAi(false);
      };

      // Graphique Unique
      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext("2d");
        if (chartInstance.current) chartInstance.current.destroy();

        if (!currentItem) return;

        const realPriceData = new Array(37).fill(null);
        const projPriceData = new Array(37).fill(null);
        const datesMap = new Array(37).fill("");
        const valorizationMap = new Array(37).fill(null);

        const t0Date = new Date(currentItem.launch_date);
        const p0 = currentItem.p0;

        for (let m = 0; m <= 36; m++) {
          const mDate = new Date(t0Date);
          mDate.setMonth(mDate.getMonth() + m);
          datesMap[m] = mDate.toLocaleDateString("fr-FR");
        }

        if (currentItem.monthly_data) {
          currentItem.monthly_data.forEach((mObj) => {
            const mNum = mObj.month;
            if (mNum > 36) return;

            if (mObj.date) {
              const parsedDate = new Date(mObj.date);
              if (!isNaN(parsedDate)) {
                datesMap[mNum] = parsedDate.toLocaleDateString("fr-FR");
              }
            }

            if (mObj.price !== null) {
              const valPct = p0 > 0 ? (mObj.price / p0) * 100 : null;
              valorizationMap[mNum] = valPct;

              if (mObj.isReal) {
                realPriceData[mNum] = mObj.price;
              } else {
                projPriceData[mNum] = mObj.price;
              }
            }
          });
        }

        const defaultNewCurve = new Array(37).fill(p0);
        const displayNewData = newProductHistory.length > 0 ? newProductHistory : defaultNewCurve;

        chartInstance.current = new Chart(ctx, {
          type: "line",
          data: {
            labels: allMonths,
            datasets: [
              {
                label: "Prix Rachat Réel (€)",
                data: realPriceData,
                borderColor: "#059669",
                backgroundColor: "#059669",
                borderWidth: 3,
                spanGaps: true,
                tension: 0.2,
                pointRadius: 4
              },
              {
                label: "Prix Rachat Calculé (€)",
                data: projPriceData,
                borderColor: "#2563eb",
                backgroundColor: "#2563eb",
                borderWidth: 2,
                borderDash: [5, 5],
                spanGaps: true,
                tension: 0.2,
                pointRadius: 3
              },
              {
                label: "Prix Produit Neuf (€)",
                data: displayNewData,
                borderColor: "#94a3b8",
                backgroundColor: "#94a3b8",
                borderWidth: 2.5,
                spanGaps: true,
                tension: 0.2,
                pointRadius: 3
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "top", labels: { color: "#334155", font: { size: 12 } } },
              tooltip: {
                callbacks: {
                  title: (tooltipItems) => {
                    const idx = tooltipItems[0].dataIndex;
                    const dateStr = datesMap[idx] ? ` (${datesMap[idx]})` : "";
                    return `${allMonths[idx]}${dateStr}`;
                  },
                  label: (context) => {
                    const idx = context.dataIndex;
                    const val = context.raw;
                    if (val === null) return `${context.dataset.label}: Non disponible`;
                    const pct = p0 > 0 ? (val / p0) * 100 : 0;
                    return [
                      `${context.dataset.label}: ${val.toFixed(2)} €`,
                      `${pct.toFixed(1)}% du prix de lancement`
                    ];
                  }
                }
              }
            },
            scales: {
              x: { grid: { color: "#e2e8f0" }, ticks: { color: "#64748b" } },
              y: { grid: { color: "#e2e8f0" }, ticks: { color: "#64748b", callback: (v) => `${v} €` } }
            }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [currentItem, newProductHistory]);

      const handleSelect = (prod) => {
        setSelectedId(prod.id);
        setSearchTerm(`${prod.name} (${prod.id})`);
        setIsDropdownOpen(false);
      };

      return (
        <div className="max-w-5xl mx-auto p-6 space-y-6">
          <header className="flex justify-between items-center border-b border-slate-200 pb-4 flex-wrap gap-4">
            <div>
              <h1 className="text-xl font-bold text-emerald-700">Analyse Argus & Prix Neuf Produit</h1>
              <p className="text-slate-500 text-xs">Suivi individuel des prix de rachat et de l'évolution du prix neuf sur le marché</p>
            </div>

            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 font-medium">Clé API Gemini :</span>
              <input
                type="password"
                placeholder="AIzaSy..."
                value={apiKey}
                onChange={handleApiKeyChange}
                className="bg-slate-50 border border-slate-200 px-2 py-1 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-600 w-40"
              />
            </div>
          </header>

          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative" ref={dropdownRef}>
            <label className="block text-xs font-semibold text-slate-600 mb-1.5">
              Sélectionner un produit (pré-rempli avec ID 44888)
            </label>
            <div className="relative">
              <input
                ref={inputRef}
                type="text"
                placeholder="Tapez le nom ou l'ID du produit..."
                value={searchTerm}
                onFocus={() => setIsDropdownOpen(true)}
                onChange={(e) => {
                  setSearchTerm(e.target.value);
                  setIsDropdownOpen(true);
                }}
                className="w-full bg-slate-50 border border-slate-200 p-3 pr-10 rounded-lg text-sm text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-600"
              />
              {searchTerm && (
                <button
                  onClick={() => {
                    setSearchTerm("");
                    setSelectedId("");
                    setIsDropdownOpen(true);
                    if (inputRef.current) inputRef.current.focus();
                  }}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm font-bold"
                >
                  ✕
                </button>
              )}
            </div>

            {isDropdownOpen && (
              <div className="absolute z-50 left-0 right-0 mt-2 max-h-60 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-xl divide-y divide-slate-100">
                {filteredProducts.length > 0 ? (
                  filteredProducts.map((p) => (
                    <div
                      key={p.id}
                      onClick={() => handleSelect(p)}
                      className={`p-3 text-sm hover:bg-slate-50 cursor-pointer flex justify-between items-center ${
                        p.id === selectedId ? "bg-emerald-50 text-emerald-800 font-semibold" : "text-slate-700"
                      }`}
                    >
                      <span>{p.name}</span>
                      <span className="text-xs font-mono text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                        ID: {p.id}
                      </span>
                    </div>
                  ))
                ) : (
                  <div className="p-3 text-xs text-slate-400 text-center">Aucun produit trouvé</div>
                )}
              </div>
            )}
          </div>

          {currentItem ? (
            <div className="space-y-6">
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center flex-wrap gap-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-900">{currentItem.product}</h2>
                  <p className="text-xs text-slate-500 mt-0.5 font-mono">
                    Constructeur : <b className="text-slate-700">{currentItem.manufacturer}</b> | ID : <b className="text-slate-700">{currentItem.idproduct}</b>
                  </p>
                </div>

                <div className="flex gap-6 font-mono text-xs">
                  <div className="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-center">
                    <span className="text-slate-400 block text-[10px]">Lancement</span>
                    <b className="text-slate-700 text-sm">{new Date(currentItem.launch_date).toLocaleDateString("fr-FR")}</b>
                  </div>
                  <div className="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-center">
                    <span className="text-slate-400 block text-[10px]">Prix P0 Initial</span>
                    <b className="text-emerald-700 text-sm">{currentItem.p0} €</b>
                  </div>
                </div>
              </div>

              {/* Encart IA : 5 Vitrines de Repreneurs */}
              <div className="bg-white p-5 rounded-xl border border-emerald-200 shadow-sm space-y-4">
                <div className="flex justify-between items-center flex-wrap gap-2">
                  <div>
                    <h3 className="text-sm font-bold text-emerald-800 flex items-center gap-2">
                      🔍 Offres de Reprise en Direct (5 Vitrines Web)
                    </h3>
                    <p className="text-xs text-slate-500">
                      Comparatif des prix de rachat actuels chez 5 repreneurs majeurs (Grade {selectedGrade})
                    </p>
                  </div>
                  <button
                    onClick={analyzeWithGemini}
                    disabled={loadingAi}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition-colors shadow-sm disabled:opacity-50"
                  >
                    {loadingAi ? "Recherche en cours..." : "Rechercher les prix web à date"}
                  </button>
                </div>

                {/* Grille des 5 Vitrines */}
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 font-mono">
                  {buyersList.map((buyer) => {
                    const price = aiAnalysis?.buyers?.[buyer.key];
                    const p0 = currentItem.p0;
                    const pct = (price !== null && price !== undefined && p0 > 0) ? ((price / p0) * 100).toFixed(1) : null;

                    return (
                      <div key={buyer.key} className="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-col justify-between">
                        <div>
                          <div className="font-bold text-xs text-slate-800 truncate">{buyer.label}</div>
                          <div className="text-[10px] text-slate-400 truncate">{buyer.domain}</div>
                        </div>

                        <div className="mt-3 pt-2 border-t border-slate-200/80">
                          <div className="text-sm font-extrabold text-emerald-700">
                            {price !== null && price !== undefined ? `${price} €` : "-"}
                          </div>
                          <div className="text-[11px] text-slate-500 font-normal mt-0.5">
                            {pct !== null ? `${pct} % de P0` : "-"}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {aiAnalysis?.ai_projection_text && (
                  <p className="text-xs text-slate-600 font-sans italic bg-slate-50 p-2.5 rounded border border-slate-200">
                    "{aiAnalysis.ai_projection_text}"
                  </p>
                )}
              </div>

              <div className="space-y-0">
                <div className="flex space-x-1 border-b border-slate-200 px-2">
                  {gradesList.map((g) => (
                    <button
                      key={g}
                      onClick={() => setSelectedGrade(g)}
                      className={`px-5 py-2.5 text-xs font-bold rounded-t-lg transition-colors border-t border-x ${
                        selectedGrade === g
                          ? "bg-white text-emerald-700 border-slate-200 border-b-white -mb-px z-10"
                          : "bg-slate-100 text-slate-500 border-transparent hover:bg-slate-200 hover:text-slate-800"
                      }`}
                    >
                      Grade {g}
                    </button>
                  ))}
                </div>

                <div className="bg-white rounded-b-xl rounded-tr-xl border border-slate-200 p-5 space-y-6 shadow-sm">
                  <div>
                    <h3 className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">
                      Trajectoires de Prix M0 à M36 (Grade {selectedGrade})
                    </h3>
                    <div className="h-72 w-full">
                      <canvas ref={chartRef}></canvas>
                    </div>
                  </div>

                  <div>
                    <h3 className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">
                      Valeurs aux Horizons Clés (% du prix de lancement P0)
                    </h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-center text-xs whitespace-nowrap border-collapse">
                        <thead className="bg-slate-50 text-slate-500 border-b border-slate-200">
                          <tr>
                            <th className="p-3 text-left font-semibold">Métrique</th>
                            {targetHorizonLabels.map((h) => (
                              <th key={h} className="p-3 font-semibold">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody className="font-mono divide-y divide-slate-200 border-b border-slate-200">
                          <tr className="hover:bg-slate-50/50">
                            <td className="p-3.5 text-left font-sans font-bold text-slate-700 bg-slate-50/80">
                              Argus / Prévision
                            </td>
                            {targetHorizons.map((m) => {
                              const hObj = currentItem.horizons ? currentItem.horizons.find((h) => h.monthLabel === `+${m}M`) : null;
                              if (!hObj || hObj.price === null) {
                                return <td key={m} className="p-3.5 text-slate-400">-</td>;
                              }
                              const p0 = currentItem.p0;
                              const valPct = p0 > 0 ? (hObj.price / p0) * 100 : null;
                              return (
                                <td key={m} className="p-3.5">
                                  <div className={`font-bold ${hObj.isReal ? 'text-emerald-700' : 'text-blue-600'}`}>
                                    {hObj.price.toFixed(2)} €
                                  </div>
                                  <div className="text-[11px] text-slate-500 font-normal mt-0.5">
                                    {valPct !== null ? `(${valPct.toFixed(1)} %)` : "-"}
                                  </div>
                                </td>
                              );
                            })}
                          </tr>

                          <tr className="hover:bg-slate-50/50">
                            <td className="p-3.5 text-left font-sans font-bold text-slate-600 bg-slate-50/80">
                              Prix du Neuf
                            </td>
                            {targetHorizons.map((m) => {
                              const p0 = currentItem.p0;
                              const newPrice = newProductHistory.length > m ? newProductHistory[m] : p0;
                              const valPct = p0 > 0 ? (newPrice / p0) * 100 : null;

                              return (
                                <td key={m} className="p-3.5">
                                  <div className="font-bold text-slate-600">
                                    {newPrice ? `${newPrice.toFixed(2)} €` : "-"}
                                  </div>
                                  <div className="text-[11px] text-slate-500 font-normal mt-0.5">
                                    {valPct !== null ? `(${valPct.toFixed(1)} %)` : "-"}
                                  </div>
                                </td>
                              );
                            })}
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="p-12 text-center text-slate-400 bg-white rounded-xl border border-slate-200 text-sm shadow-sm">
              Veuillez sélectionner un produit dans la liste pour afficher ses analyses.
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TimelineApp />);
  </script>
</body>
</html>
