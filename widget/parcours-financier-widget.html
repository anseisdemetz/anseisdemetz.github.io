<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Diagramme de flux - Parcours Client / Swikly / Viva</title>
  <style>
    :root {
      --bg-client: #f0f4f8;
      --bg-swikly: #fdf6e7;
      --bg-viva: #f3f0f9;
      --border-lane: #cbd5e1;
      --stroke-node: #334155;
      --bg-node: #ffffff;
      --bg-start-end: #e2e8f0;
      --bg-cancelled: #fee2e2;
      --stroke-cancelled: #ef4444;
      --text-cancelled: #991b1b;
      --text-main: #0f172a;
      --line-color: #475569;
      --line-color-blue: #0080FF;
      --phase-line: #94a3b8;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
    }

    .diagram-container {
      background-color: #ffffff;
      border: 1px solid var(--border-lane);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="diagram-container">
    <svg width="900" height="1340" viewBox="0 0 900 1340" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Marker for arrowheads -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line-color)" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--stroke-cancelled)" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line-color-blue)" />
        </marker>
      </defs>

      <!-- SWIMLANES BACKGROUNDS -->
      <rect x="0" y="0" width="300" height="1340" fill="var(--bg-client)" />
      <rect x="300" y="0" width="300" height="1340" fill="var(--bg-swikly)" />
      <rect x="600" y="0" width="300" height="1340" fill="var(--bg-viva)" />

      <!-- LANE SEPARATORS -->
      <line x1="300" y1="0" x2="300" y2="1340" stroke="var(--border-lane)" stroke-width="2" />
      <line x1="600" y1="0" x2="600" y2="1340" stroke="var(--border-lane)" stroke-width="2" />

      <!-- LANE HEADERS BACKGROUND -->
      <rect x="0" y="0" width="300" height="50" fill="#e2e8f0" />
      <rect x="300" y="0" width="300" height="50" fill="#fef3c7" />
      <rect x="600" y="0" width="300" height="50" fill="#e9d5ff" />
      <line x1="0" y1="50" x2="900" y2="50" stroke="var(--border-lane)" stroke-width="2" />

      <!-- LANE HEADERS TEXT -->
      <text x="150" y="32" font-size="16" font-weight="bold" text-anchor="middle">CLIENT</text>
      <text x="450" y="32" font-size="16" font-weight="bold" text-anchor="middle">SWIKLY</text>
      <text x="750" y="32" font-size="16" font-weight="bold" text-anchor="middle">VIVA</text>

      <!-- PHASE 1 NODES -->

      <!-- START NODE -->
      <!-- Node: CLIENT Start -->
      <g id="node-start">
        <rect x="100" y="70" width="100" height="40" rx="20" fill="var(--bg-start-end)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="150" y="95" font-size="14" font-weight="bold" text-anchor="middle">CLIENT</text>
      </g>

      <!-- STEP 1 (SWIKLY INVERSE) -->
      <!-- Node: 1. Saisit des données CB -->
      <g id="node-step-1">
        <polygon points="450,140 550,175 450,210 350,175" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="450" y="171" font-size="13" font-weight="bold" text-anchor="middle">1. Saisis des</text>
        <text x="450" y="186" font-size="13" font-weight="bold" text-anchor="middle">données CB</text>
      </g>

      <!-- STEP 2 (FORMULAIRE CLIENT) -->
      <!-- Node: 2. Formulaire utilisateur -->
      <g id="node-step-2">
        <polygon points="150,345 250,380 150,415 50,380" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="150" y="376" font-size="13" font-weight="bold" text-anchor="middle">2. Formulaire</text>
        <text x="150" y="391" font-size="13" font-weight="bold" text-anchor="middle">utilisateur</text>
      </g>

      <!-- Node: Transaction annulée (Step 2 NON) -->
      <g id="node-cancel-2">
        <rect x="15" y="445" width="130" height="40" rx="10" fill="var(--bg-cancelled)" stroke="var(--stroke-cancelled)" stroke-width="2" />
        <text x="80" y="470" font-size="12" font-weight="bold" fill="var(--text-cancelled)" text-anchor="middle">Transaction annulée</text>
      </g>





      <!-- Node: 3. Carte d'identité -->
      <g id="node-step-3">
        <polygon points="150,590 250,625 150,660 50,625" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="150" y="621" font-size="13" font-weight="bold" text-anchor="middle">3. Carte</text>
        <text x="150" y="636" font-size="13" font-weight="bold" text-anchor="middle">d'identité</text>
      </g>

      <!-- Node: Transaction annulée (Step 3 NON) -->
      <g id="node-cancel-3">
        <rect x="15" y="690" width="130" height="40" rx="10" fill="var(--bg-cancelled)" stroke="var(--stroke-cancelled)" stroke-width="2" />
        <text x="80" y="715" font-size="12" font-weight="bold" fill="var(--text-cancelled)" text-anchor="middle">Transaction annulée</text>
      </g>

      <!-- STEP 4 -->
      <!-- Node: 4. Signature électronique -->
      <g id="node-step-4">
        <polygon points="150,755 250,790 150,825 50,790" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="150" y="786" font-size="13" font-weight="bold" text-anchor="middle">4. Signature</text>
        <text x="150" y="801" font-size="13" font-weight="bold" text-anchor="middle">électronique</text>
      </g>

      <!-- Node: Transaction annulée (Step 4 NON) -->
      <g id="node-cancel-4">
        <rect x="15" y="855" width="130" height="40" rx="10" fill="var(--bg-cancelled)" stroke="var(--stroke-cancelled)" stroke-width="2" />
        <text x="80" y="880" font-size="12" font-weight="bold" fill="var(--text-cancelled)" text-anchor="middle">Transaction annulée</text>
      </g>


      <!-- Node: 5. Saisit sa carte auprès de VIVA -->
      <g id="node-step-5">
        <rect x="660" y="960" width="180" height="50" rx="4" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="750" y="981" font-size="12" font-weight="bold" text-anchor="middle">5. Saisit sa carte</text>
        <text x="750" y="996" font-size="12" font-weight="bold" text-anchor="middle">auprès de VIVA</text>
      </g>

      <!-- STEP CONTROL 3-D SECURE -->
      <!-- Node: Contrôle 3-D Secure / vérification du moyen de paiement -->
      <g id="node-control-3d">
        <polygon points="750,1035 880,1085 750,1135 620,1085" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="750" y="1073" font-size="11" font-weight="bold" text-anchor="middle">Contrôle 3-D Secure /</text>
        <text x="750" y="1088" font-size="11" font-weight="bold" text-anchor="middle">vérification du moyen</text>
        <text x="750" y="1103" font-size="11" font-weight="bold" text-anchor="middle">de paiement</text>
      </g>

      <!-- Node: parcours Différé IBAN / CB + Annulation de l'empreinte avec SWIKLY (Control 3D NON) -->
      <g id="node-iban-2">
        <rect x="640" y="1165" width="220" height="50" rx="4" fill="var(--bg-node)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="750" y="1186" font-size="11" font-weight="bold" text-anchor="middle">Parcours Différé IBAN / CB</text>
        <text x="750" y="1201" font-size="11" font-weight="bold" text-anchor="middle">Annulation de l'empreinte avec SWIKLY</text>
      </g>

      <!-- END PHASE 1 NODE -->
      <!-- Node: PAIEMENT IMMEDIAT (TRANSACTION PAYÉE) -->
      <g id="node-payment-immediate">
        <rect x="640" y="1245" width="220" height="44" rx="22" fill="var(--bg-start-end)" stroke="var(--stroke-node)" stroke-width="2" />
        <text x="750" y="1264" font-size="11" font-weight="bold" text-anchor="middle">PAIEMENT IMMEDIAT</text>
        <text x="750" y="1278" font-size="11" font-weight="bold" text-anchor="middle">(TRANSACTION PAYÉE)</text>
      </g>


      <!-- CONNECTIONS / FLOW ARROWS -->

      <!-- Client Start -> Step 1 (Swikly CB) -->
      <path d="M 150 110 L 150 125 L 450 125 L 450 140" fill="none" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Step 1 NON -> parcours alternatif par IBAN -->
      <path d="M 550 175 L 580 175 L 580 380 L 250 380" fill="none" stroke="var(--line-color-blue)" stroke-width="2" marker-end="url(#arrow-blue)" />
      <text x="570" y="170" font-size="11" font-weight="bold" fill="var(--line-color)">NON</text>

      <path d="M 450 912 L 450 1190 L 638 1190" fill="none" stroke="var(--line-color-blue)" stroke-width="2" marker-end="url(#arrow-blue)" />

      <!-- Step 1 OUI -> Step 2 (Formulaire Client) -->
      <path d="M 450 210 L 450 310 L 150 310 L 150 345" fill="none" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="425" y="230" font-size="11" font-weight="bold" fill="var(--line-color)">OUI</text>

      <!-- Step 2 NON -> Transaction annulée -->
      <path d="M 100 380 L 80 380 L 80 445" fill="none" stroke="var(--stroke-cancelled)" stroke-width="2" marker-end="url(#arrow-red)" />
      <text x="48" y="415" font-size="11" font-weight="bold" fill="var(--text-cancelled)">NON</text>

      <!-- Step 2 OUI -> Retour à Comparecycle + Transaction créée -->
      <path d="M 250 380 L 250 380 L 250 510 L 150 510 L 150 590" fill="none" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="255" y="415" font-size="11" font-weight="bold" fill="var(--line-color)">OUI</text>


      <!-- Step 3 NON -> Transaction annulée -->
      <path d="M 100 625 L 80 625 L 80 690" fill="none" stroke="var(--stroke-cancelled)" stroke-width="2" marker-end="url(#arrow-red)" />
      <text x="48" y="665" font-size="11" font-weight="bold" fill="var(--text-cancelled)">NON</text>

      <!-- Step 3 OUI -> Step 4 -->
      <line x1="150" y1="660" x2="150" y2="755" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="155" y="675" font-size="11" font-weight="bold" fill="var(--line-color)">OUI</text>

      <!-- Step 4 NON -> Transaction annulée -->
      <path d="M 100 790 L 80 790 L 80 855" fill="none" stroke="var(--stroke-cancelled)" stroke-width="2" marker-end="url(#arrow-red)" />
      <text x="48" y="830" font-size="11" font-weight="bold" fill="var(--text-cancelled)">NON</text>

      <!-- Step 4 OUI -> VIVA Start -->
      <path d="M 150 825 L 150 913 L 750 913 L 750 960" fill="none" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="155" y="840" font-size="11" font-weight="bold" fill="var(--line-color)">OUI</text>

      <!-- VIVA Start -> Step 5
      <line x1="750" y1="931" x2="750" y2="960" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" /> -->

      <!-- Step 5 -> Control 3D -->
      <line x1="750" y1="1010" x2="750" y2="1035" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Control 3D NON -> IBAN + Annulation -->
      <line x1="750" y1="1135" x2="750" y2="1165" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="755" y="1150" font-size="11" font-weight="bold" fill="var(--line-color)">NON</text>

      <!-- Control 3D OUI -> PAIEMENT IMMEDIAT -->
      <path d="M 880 1085 L 890 1085 L 890 1267 L 860 1267" fill="none" stroke="var(--line-color)" stroke-width="2" marker-end="url(#arrow)" />
      <text x="865" y="1130" font-size="11" font-weight="bold" fill="var(--line-color)">OUI</text>

    </svg>
  </div>

</body>
</html>
