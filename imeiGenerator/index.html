<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur IMEI - Mobiles uniquement</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; max-width: 900px; color: #333; }
        .filter-section { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        select, input[type="text"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 15px; background: #fafafa; }
        .results-list { border: 1px solid #ccc; border-radius: 4px; max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .product-item { padding: 10px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .product-item:hover { background-color: #eef5ff; }
        .badge { background: #28a745; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #0056b3; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        .tac-tag { display: inline-block; background: #e2e3e5; padding: 4px 8px; margin: 2px; border-radius: 4px; font-family: monospace; }
        .status-msg { padding: 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        .status-loading { background-color: #fff3cd; color: #856404; }
        .status-error { background-color: #f8d7da; color: #721c24; }
        
        /* Terminal Console */
        .page-console {
            background-color: #1e1e1e;
            color: #4af626;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px #000;
        }
        .page-console .log-header { color: #569cd6; font-weight: bold; margin-bottom: 5px; }
        .page-console .log-item { margin-left: 15px; color: #dcdcdc; }
        .page-console .log-time { color: #808080; font-size: 0.85em; }
    </style>
</head>
<body>

    <h2>Recherche Mobiles & Générateur d'IMEI</h2>

    <!-- Statut de préchargement des données API -->
    <div id="statusMessage" class="status-msg status-loading">Chargement et filtrage des produits Mobiles depuis l'API...</div>

    <!-- Filtres (Marque uniquement + Recherche modèle) -->
    <div class="filter-section">
        <select id="manufacturerFilter" onchange="applyFilters()" disabled>
            <option value="">-- Toutes les Marques (Mobiles) --</option>
        </select>

        <input type="text" id="searchInput" placeholder="Rechercher un modèle de mobile..." onkeyup="applyFilters()" disabled>
    </div>

    <!-- Résultats (Max 15) -->
    <div id="resultsCount" style="font-size: 0.9em; color: #555;"></div>
    <div id="searchResults" class="results-list" style="display: none;"></div>

    <!-- Fiche du produit sélectionné -->
    <div id="productDetailCard" class="card" style="display: none;">
        <h3 id="prodModel"></h3>
        <p><strong>Marque :</strong> <span id="prodBrand"></span> | <strong>Type :</strong> <span id="prodType"></span></p>
        
        <div>
            <strong>TACs associés à ce produit :</strong>
            <div id="tacList" style="margin-top: 5px;"></div>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <button onclick="generateAndLogIMEIs()">Générer les IMEI</button>

        <!-- Console UI -->
        <div id="pageConsole" class="page-console" style="display: none;"></div>
    </div>

    <script>
        const CONFIG = {
            CHECK_API_DOMAIN: "https://corsproxy.io/?" + encodeURIComponent("https://preprod-moby-api.comparecycle.com/Catalog/getProducts"),
            CHECK_API_TOKEN: "eYqShpHvgt9nkuNrgqtPhGvggvCHM9TY"
        };

        // Types assimilés à la catégorie "Mobile"
        const MOBILE_TYPES = ["mobile", "smartphone", "téléphone", "telephone"];

        let mobileProducts = [];
        let selectedProduct = null;

        // 1. Préchargement complet des données depuis l'API
        async function preloadProductsAPI() {
            const statusDiv = document.getElementById('statusMessage');
            try {
                const response = await fetch(CONFIG.CHECK_API_DOMAIN, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.CHECK_API_TOKEN}`,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP : ${response.status}`);
                }

                const data = await response.json();
                const rawList = Array.isArray(data) ? data : (data.products || data.data || []);

                // Filtrage direct au chargement :
                // 1. Uniquement type "Mobile" (Mobile, Smartphone, etc.)
                // 2. Exclusion des produits avec is_imei_required === "no"
                mobileProducts = rawList.filter(p => {
                    const productType = (p.type || "").toLowerCase().trim();
                    const isMobileCategory = MOBILE_TYPES.includes(productType);
                    const isImeiRequired = String(p.is_imei_required).toLowerCase() !== "no";

                    return isMobileCategory && isImeiRequired;
                });

                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                statusDiv.innerText = `${mobileProducts.length} mobiles préchargés avec succès.`;

                populateManufacturerDropdown();
                enableUI();
                applyFilters();

            } catch (error) {
                console.error("Erreur de chargement API:", error);
                statusDiv.className = 'status-msg status-error';
                statusDiv.innerText = `Erreur lors du chargement des données : ${error.message}`;
            }
        }

        // 2. Remplissage du menu déroulant Marque (Uniquement les marques de Mobiles)
        function populateManufacturerDropdown() {
            const brandSelect = document.getElementById('manufacturerFilter');
            brandSelect.innerHTML = '<option value="">-- Toutes les Marques (Mobiles) --</option>';

            // Extraction des marques uniques de la liste filtrée
            const mobileBrands = [...new Set(mobileProducts.map(p => p.manufacturer).filter(Boolean))].sort();

            mobileBrands.forEach(brand => {
                brandSelect.add(new Option(brand, brand));
            });
        }

        // 3. Activation des contrôles utilisateur
        function enableUI() {
            document.getElementById('manufacturerFilter').disabled = false;
            document.getElementById('searchInput').disabled = false;
        }

        // 4. Algorithme de Luhn
        function calculateLuhnCheckDigit(first14) {
            let sum = 0;
            for (let i = 0; i < 14; i++) {
                let digit = parseInt(first14.charAt(i), 10);
                if (i % 2 !== 0) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
            }
            return (10 - (sum % 10)) % 10;
        }

        // 5. Générateur d'IMEI à partir du TAC
        function createSingleIMEI(tac) {
            let cleanTac = String(tac).padStart(8, '0').slice(0, 8);
            let snr = Math.floor(100000 + Math.random() * 900000).toString();
            let first14 = cleanTac + snr;
            let checkDigit = calculateLuhnCheckDigit(first14);
            return first14 + checkDigit;
        }

        // 6. Application des filtres de recherche
        function applyFilters() {
            const selectedBrand = document.getElementById('manufacturerFilter').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            const filtered = mobileProducts.filter(p => {
                const matchBrand = !selectedBrand || p.manufacturer === selectedBrand;
                const modelName = p.model || p.product || "";
                const matchQuery = !searchQuery || modelName.toLowerCase().includes(searchQuery);

                return matchBrand && matchQuery;
            });

            renderResults(filtered.slice(0, 15), filtered.length);
        }

        // 7. Rendu des 15 premiers résultats
        function renderResults(products, totalCount) {
            const resultsDiv = document.getElementById('searchResults');
            const countDiv = document.getElementById('resultsCount');
            resultsDiv.innerHTML = '';

            countDiv.innerText = `${products.length} résultat(s) affiché(s) sur ${totalCount} disponible(s) (Max 15).`;

            if (products.length === 0) {
                resultsDiv.style.display = 'none';
                return;
            }

            products.forEach(p => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <span><strong>${p.manufacturer || 'N/A'}</strong> - ${p.model || p.product}</span>
                    <span class="badge">${p.type}</span>
                `;
                item.onclick = () => selectProduct(p);
                resultsDiv.appendChild(item);
            });

            resultsDiv.style.display = 'block';
        }

        // 8. Sélection d'un produit et affichage des TACs
        function selectProduct(product) {
            selectedProduct = product;
            
            document.getElementById('prodModel').innerText = product.model || product.product;
            document.getElementById('prodBrand').innerText = product.manufacturer || 'N/A';
            document.getElementById('prodType').innerText = product.type || 'N/A';

            const tacContainer = document.getElementById('tacList');
            let tacs = product.tac;

            if (typeof tacs === 'string') {
                try { tacs = JSON.parse(tacs); } catch(e) { tacs = [tacs]; }
            }

            if (Array.isArray(tacs) && tacs.length > 0) {
                tacContainer.innerHTML = tacs.map(t => `<span class="tac-tag">${t}</span>`).join(' ');
            } else {
                tacContainer.innerHTML = `<em>Aucun TAC fourni pour ce produit.</em>`;
            }

            document.getElementById('pageConsole').style.display = 'none';
            document.getElementById('productDetailCard').style.display = 'block';
        }

        // 9. Génération et écriture dans la console UI
        function generateAndLogIMEIs() {
            if (!selectedProduct) return;

            let tacs = selectedProduct.tac;
            if (typeof tacs === 'string') {
                try { tacs = JSON.parse(tacs); } catch(e) { tacs = [tacs]; }
            }

            // Fallback si le tableau de TAC est vide
            if (!Array.isArray(tacs) || tacs.length === 0) {
                tacs = ["01234567"]; 
            }

            const imeis = [];
            for (let i = 0; i < 5; i++) {
                const tacToUse = tacs[i % tacs.length];
                imeis.push(createSingleIMEI(tacToUse));
            }

            const consoleBox = document.getElementById('pageConsole');
            const time = new Date().toLocaleTimeString();

            let consoleOutput = `
                <div class="log-header">
                    <span class="log-time">[${time}]</span> > 5 IMEIs générés pour "${selectedProduct.model || selectedProduct.product}"
                </div>
                <div style="margin-left: 10px; color: #aaa; margin-bottom: 8px;">TAC(s) utilisé(s) : ${tacs.join(', ')}</div>
            `;

            imeis.forEach((imei, idx) => {
                consoleOutput += `<div class="log-item">${idx + 1}. ${imei}</div>`;
            });

            consoleBox.innerHTML = consoleOutput;
            consoleBox.style.display = 'block';
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Démarrage automatique au chargement
        window.onload = preloadProductsAPI;
    </script>
</body>
</html>
