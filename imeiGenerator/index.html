<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sélecteur de Produit & Générateur d'IMEI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; max-width: 900px; color: #333; }
        .filter-section { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        select, input[type="text"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 180px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 15px; background: #fafafa; }
        .results-list { border: 1px solid #ccc; border-radius: 4px; max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .product-item { padding: 10px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .product-item:hover { background-color: #eef5ff; }
        .badge { background: #007bff; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #218838; }
        .tac-tag { display: inline-block; background: #e2e3e5; padding: 4px 8px; margin: 2px; border-radius: 4px; font-family: monospace; }
        .console-notice { margin-top: 10px; font-size: 0.9em; color: #6c757d; font-style: italic; }
    </style>
</head>
<body>

    <h2>Recherche Produits & Générateur d'IMEI</h2>

    <!-- Filtres -->
    <div class="filter-section">
        <select id="typeFilter" onchange="applyFilters()">
            <option value="">-- Toutes les Catégories --</option>
        </select>

        <select id="manufacturerFilter" onchange="applyFilters()">
            <option value="">-- Toutes les Marques --</option>
        </select>

        <input type="text" id="searchInput" placeholder="Rechercher par modèle..." onkeyup="applyFilters()">
    </div>

    <!-- Résultats (Max 15) -->
    <div id="resultsCount" style="font-size: 0.9em; color: #555;"></div>
    <div id="searchResults" class="results-list" style="display: none;"></div>

    <!-- Fiche du produit sélectionné -->
    <div id="productDetailCard" class="card" style="display: none;">
        <h3 id="prodModel"></h3>
        <p><strong>Catégorie :</strong> <span id="prodType"></span> | <strong>Marque :</strong> <span id="prodBrand"></span></p>
        
        <div>
            <strong>TACs associés à ce produit :</strong>
            <div id="tacList" style="margin-top: 5px;"></div>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <button onclick="generateAndLogIMEIs()">Générer les IMEI (Console)</button>
        <div class="console-notice">💡 Les 5 IMEIs valides seront affichés dans la console de votre navigateur (F12).</div>
    </div>

    <script>
        const CONFIG = {
            CHECK_API_DOMAIN: "https://preprod-moby-api.comparecycle.com/Catalog/getProducts",
            CHECK_API_TOKEN: "eYqShpHvgt9nkuNrgqtPhGvggvCHM9TY"
        };

        // Données d'exemple (enrichies pour illustrer le filtrage)
        const productsData = [
            {
                "idproduct": 252,
                "model": "iPad 2 Wi-Fi 16Go",
                "idmanufacturer": 4,
                "idproduct_type": 2,
                "is_imei_required": "yes", // Modifié à "yes" pour apparaître
                "type": "Tablette",
                "manufacturer": "Apple",
                "tac": ["01234567", "35875205"],
                "product": "iPad 2 Wi-Fi 16Go"
            },
            {
                "idproduct": 253,
                "model": "iPhone 13 128Go",
                "is_imei_required": "yes",
                "type": "Smartphone",
                "manufacturer": "Apple",
                "tac": ["35301406", "35301407"]
            },
            {
                "idproduct": 254,
                "model": "Galaxy S21 5G",
                "is_imei_required": "yes",
                "type": "Smartphone",
                "manufacturer": "Samsung",
                "tac": ["35281211"]
            },
            {
                "idproduct": 255,
                "model": "MacBook Air M1",
                "is_imei_required": "no", // Sera ÉLIMINÉ automatiquement
                "type": "Ordinateur",
                "manufacturer": "Apple",
                "tac": []
            }
        ];

        let selectedProduct = null;

        // Init : Remplissage automatique des menus déroulants de filtres
        function initFilters() {
            const types = [...new Set(productsData.map(p => p.type))];
            const manufacturers = [...new Set(productsData.map(p => p.manufacturer))];

            const typeSelect = document.getElementById('typeFilter');
            types.forEach(t => typeSelect.add(new Option(t, t)));

            const brandSelect = document.getElementById('manufacturerFilter');
            manufacturers.forEach(m => brandSelect.add(new Option(m, m)));

            applyFilters();
        }

        // Algorithme de Luhn pour calculer la clé de contrôle (15ème chiffre de l'IMEI)
        function calculateLuhnCheckDigit(first14) {
            let sum = 0;
            for (let i = 0; i < 14; i++) {
                let digit = parseInt(first14.charAt(i), 10);
                if (i % 2 !== 0) { // Positions impaires (1-indexed : 2, 4, 6...)
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
            }
            return (10 - (sum % 10)) % 10;
        }

        // Génère 1 IMEI valide à partir d'un TAC
        function createSingleIMEI(tac) {
            let cleanTac = String(tac).padStart(8, '0').slice(0, 8);
            let snr = Math.floor(100000 + Math.random() * 900000).toString(); // SNR à 6 chiffres
            let first14 = cleanTac + snr;
            let checkDigit = calculateLuhnCheckDigit(first14);
            return first14 + checkDigit;
        }

        // Application des filtres & affichage des 15 premiers résultats
        function applyFilters() {
            const selectedType = document.getElementById('typeFilter').value;
            const selectedBrand = document.getElementById('manufacturerFilter').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            // Filtrage : Exclusion stricte de is_imei_required === "no"
            const filtered = productsData.filter(p => {
                const isImeiRequired = String(p.is_imei_required).toLowerCase() !== "no";
                const matchType = !selectedType || p.type === selectedType;
                const matchBrand = !selectedBrand || p.manufacturer === selectedBrand;
                const matchQuery = !searchQuery || p.model.toLowerCase().includes(searchQuery);

                return isImeiRequired && matchType && matchBrand && matchQuery;
            });

            // Limitation aux 15 premiers résultats
            const top15 = filtered.slice(0, 15);

            renderResults(top15, filtered.length);
        }

        // Rendu de la liste
        function renderResults(products, totalCount) {
            const resultsDiv = document.getElementById('searchResults');
            const countDiv = document.getElementById('resultsCount');
            resultsDiv.innerHTML = '';

            countDiv.innerText = `${products.length} résultat(s) affiché(s) sur ${totalCount} trouvé(s) (Max 15).`;

            if (products.length === 0) {
                resultsDiv.style.display = 'none';
                return;
            }

            products.forEach(p => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <span><strong>${p.manufacturer}</strong> - ${p.model}</span>
                    <span class="badge">${p.type}</span>
                `;
                item.onclick = () => selectProduct(p);
                resultsDiv.appendChild(item);
            });

            resultsDiv.style.display = 'block';
        }

        // Sélection d'un produit et affichage de ses TACs
        function selectProduct(product) {
            selectedProduct = product;
            
            document.getElementById('prodModel').innerText = product.model;
            document.getElementById('prodType').innerText = product.type;
            document.getElementById('prodBrand').innerText = product.manufacturer;

            // Rendu des TACs
            const tacContainer = document.getElementById('tacList');
            if (product.tac && product.tac.length > 0) {
                tacContainer.innerHTML = product.tac.map(t => `<span class="tac-tag">${t}</span>`).join(' ');
            } else {
                tacContainer.innerHTML = `<em>Aucun TAC local disponible (Appel API requis).</em>`;
            }

            document.getElementById('productDetailCard').style.display = 'block';
        }

        // Action du bouton : Générer et logger 5 IMEIs dans la console
        function generateAndLogIMEIs() {
            if (!selectedProduct) return;

            let tacs = selectedProduct.tac;

            // TAC de secours si le tableau est vide
            if (!tacs || tacs.length === 0) {
                tacs = ["01234567"]; 
            }

            const imeis = [];
            for (let i = 0; i < 5; i++) {
                // Utilisation alternée si plusieurs TACs
                const tacToUse = tacs[i % tacs.length];
                imeis.push(createSingleIMEI(tacToUse));
            }

            // --- SORTIE CONSOLE ---
            console.group(`--- IMEIs Générés pour : ${selectedProduct.manufacturer} ${selectedProduct.model} ---`);
            console.log(`TAC(s) utilisé(s) :`, tacs);
            console.log(`Liste des 5 IMEIs valides :`);
            imeis.forEach((imei, index) => {
                console.log(`  ${index + 1}. ${imei}`);
            });
            console.groupEnd();

            alert(`5 IMEIs ont été générés avec succès !\nOuvrez la console de votre navigateur (F12) pour les consulter.`);
        }

        // Initialisation au chargement de la page
        window.onload = initFilters;
    </script>
</body>
</html>
