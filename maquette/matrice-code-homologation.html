<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproduction Modale - Matrice Complète</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #6c757d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Arrière-plan sombre de la modale */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    /* Conteneur principal */
    .modal-container {
      background: #ffffff;
      border-radius: 4px;
      width: 600px;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 11px 15px -7px rgba(0,0,0,0.2), 
                  0 24px 38px 3px rgba(0,0,0,0.14), 
                  0 9px 46px 8px rgba(0,0,0,0.12);
    }

    /* En-tête */
    .modal-header {
      padding: 20px 24px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 500;
      color: #212121;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: #757575;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .btn-close:hover {
      color: #212121;
    }

    /* Zone de recherche */
    .search-container {
      padding: 0 24px 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 10px 36px 10px 40px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #00acc1;
      box-shadow: 0 0 0 2px rgba(0, 172, 193, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: #757575;
      font-size: 1.1rem;
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #757575;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .search-clear-btn:hover {
      color: #212121;
      background-color: #f0f0f0;
    }

    /* Corps défilant */
    .modal-body {
      padding: 20px 24px 0;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar {
      width: 8px;
    }
    .modal-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-body::-webkit-scrollbar-thumb {
      background: #9e9e9e;
      border-radius: 4px;
    }

    /* Champs de formulaire */
    .form-group {
      margin-bottom: 20px;
      position: relative;
      display: block;
    }

    .form-group.hidden {
      display: none;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      color: #757575;
      margin-bottom: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-bottom: 2px solid #00acc1;
    }

    .form-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 4px 60px 6px 0;
      font-size: 0.95rem;
      color: #212121;
    }

    .field-icons {
      position: absolute;
      right: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #616161;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #616161;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .icon-btn:hover {
      color: #212121;
    }

    #no-results-message {
      display: none;
      text-align: center;
      padding: 30px 0;
      color: #757575;
      font-size: 0.95rem;
    }

    /* Pied de page */
    .modal-footer {
      padding: 16px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid #e0e0e0;
    }

    .btn-action {
      background: none;
      border: none;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .btn-cancel {
      color: #e91e63;
    }

    .btn-cancel:hover {
      background-color: rgba(233, 30, 99, 0.04);
    }

    .btn-save {
      color: #00acc1;
    }

    .btn-save:hover {
      background-color: rgba(0, 172, 193, 0.04);
    }
  </style>
</head>

      </div>

      <!-- Pied de page -->
      <div class="modal-footer">

    // Génération dynamique des éléments HTML au chargement
    function renderMatrices() {
      const container = document.getElementById('dynamic-matrices-container');
      let html = '';

      matricesData.forEach(item => {
        html += `
          <div class="form-group" data-matrix-name="${item.code}">
            <label class="form-label">Prix ${item.code}</label>
            <div class="input-wrapper">
              <input type="text" class="form-input" value="${item.grade}">
              <div class="field-icons">
                <button type="button" class="icon-btn" onclick="clearInput(this)">&#10005;</button>
                <button type="button" class="icon-btn">&#9660;</button>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Fonctions d'interaction
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function clearInput(btn) {
      const input = btn.closest('.input-wrapper').querySelector('.form-input');
      if (input) {
        input.value = '';
        input.focus();
      }
    }

    function handleSearchInput() {
      const searchInput = document.getElementById('matrix-search');
      const clearBtn = document.getElementById('search-clear-btn');
      
      if (searchInput.value.trim().length > 0) {
        clearBtn.style.display = 'flex';
      } else {
        clearBtn.style.display = 'none';
      }
      
      filterMatrices();
    }

    function clearSearchInput() {
      const searchInput = document.getElementById('matrix-search');
      const clearBtn = document.getElementById('search-clear-btn');
      
      searchInput.value = '';
      clearBtn.style.display = 'none';
      searchInput.focus();
      
      filterMatrices();
    }

    function filterMatrices() {
      const searchInput = document.getElementById('matrix-search');
      const filterValue = searchInput.value.toLowerCase().trim();
      const formGroups = document.querySelectorAll('#modal-body-content .form-group');
      const noResultsMessage = document.getElementById('no-results-message');
      let visibleCount = 0;

      formGroups.forEach(group => {
        const matrixName = group.getAttribute('data-matrix-name').toLowerCase();

        if (matrixName.includes(filterValue)) {
          group.classList.remove('hidden');
          visibleCount++;
        } else {
          group.classList.add('hidden');
        }
      });

      if (visibleCount === 0 && filterValue !== '') {
        noResultsMessage.style.display = 'block';
      } else {
        noResultsMessage.style.display = 'none';
      }
    }

    // Initialisation
    renderMatrices();
