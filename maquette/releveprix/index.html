<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CompaRecycle — Relevé de prix Grading</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Layout Général CompaRecycle -->
  <div class="layout-container" id="layout-container">

    <!-- Barre supérieure -->
    <header class="top-bar">
      <div class="logo-zone" onclick="toggleSidebar()" title="Réduire/Agrandir le menu">
        <span class="logo-text">Compa<strong>Recycle</strong></span>
      </div>
      <nav class="top-nav">
        <a href="#" class="active">RELEVÉ DE PRIX GRADING</a>
        <span class="nav-arrow">›</span>
      </nav>
      <div class="user-zone">
        <span class="user-icon">👤</span>
      </div>
    </header>

    <div class="main-body">

      <!-- Sidebar gauche -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section active-group">
          <span class="sidebar-title">📊 Gestion des affiliés</span>
          <ul class="sidebar-menu">
            <li class="active"><a href="#">Relevé de prix Grading</a></li>
          </ul>
        </div>
      </aside>

      <!-- Zone de contenu principal -->
      <main class="content-area">

        <!-- Header du contenu -->
        <div class="content-header">
          <h1 class="page-title">Relevé de prix</h1>
          <div class="header-actions">
            <span id="stats-counter" class="stats-badge">Chargement...</span>
            <button class="icon-btn" title="Rechercher">🔍</button>
            <button class="icon-btn" title="Actualiser">🔄</button>
            <button class="icon-btn" title="Options">⚙️</button>
            <button class="icon-btn" title="Filtrer">🌪️</button>
          </div>
        </div>

        <!-- Tableau de prix dynamique -->
        <div id="table-app">
          <div class="table-wrapper">
            <div class="empty-state">
              Chargement des données...
            </div>
          </div>
        </div>

        <!-- Pied de page avec pagination -->
        <footer class="table-footer">
          <div class="pagination-rows">
            <span>Lignes par page</span>
            <select id="rows-per-page">
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <div class="pagination-info">
            <span id="pagination-text">0 à 0 sur 0</span>
            <div class="pagination-controls" id="pagination-controls"></div>
          </div>
        </footer>

      </main>
    </div>
  </div>

  <!-- [A028] Fenêtre Modale de détails -->
  <div id="price-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-container">
      <header class="modal-header">
        <h3 id="modal-product-title" class="modal-title">Détail du produit</h3>
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
      </header>
      <div id="modal-body" class="modal-body">
        <!-- Le sous-tableau des 7 grades est injecté ici -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
