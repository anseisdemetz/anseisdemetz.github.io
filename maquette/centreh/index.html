<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codes d'Homologation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between">

    <div class="max-w-3xl w-full mx-auto p-6 space-y-6">
        <!-- Header -->
        <header class="border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">Plateforme d'Homologation</h1>
                <p class="text-sm text-slate-400">Liste des codes de Pré-diagnostic</p>
            </div>
            <button id="reloadBtn" class="bg-slate-800 hover:bg-slate-700 text-sky-400 border border-slate-700 px-3 py-1.5 rounded-md text-xs font-mono transition">
                🔄 Recharger
            </button>
        </header>

        <!-- Zone d'affichage principal -->
        <main class="space-y-4">
            
            <!-- Message de chargement / Erreur -->
            <div id="statusMessage" class="p-4 rounded-lg bg-slate-800 border border-slate-700 text-center text-sm text-slate-300">
                Chargement des codes en cours...
            </div>

            <!-- Bloc Pré-diagnostic -->
            <section id="preDiagBlock" class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-md hidden">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                    <h2 class="text-lg font-semibold text-slate-200"># Pré-diagnostic</h2>
                    <span id="counterBadge" class="text-xs bg-slate-700 text-sky-400 font-mono px-2.5 py-1 rounded-full border border-slate-600">0 codes</span>
                </div>

                <!-- Liste des codes -->
                <div id="codesList" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                    <!-- Généré dynamiquement -->
                </div>
            </section>

            <!-- Console de Debug JSON -->
            <section class="bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono text-xs shadow-inner">
                <div class="text-slate-500 border-b border-slate-800 pb-2 mb-2 flex justify-between">
                    <span>// Réponse API Brute (JSON)</span>
                </div>
                <pre id="consoleOutput" class="text-emerald-400 overflow-x-auto max-h-48 leading-relaxed">// Attente des données...</pre>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
