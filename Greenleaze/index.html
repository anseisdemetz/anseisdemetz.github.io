<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prédiction Argus & Dépréciation - 7 Grades</title>
  <!-- Chart.js pour les graphiques -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { color: #1e293b; text-align: center; margin-bottom: 25px; }
    
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    
    .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .control-group { flex: 1; min-width: 200px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 0.9em; }
    select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 1em; }
    
    .chart-container { position: relative; height: 450px; width: 100%; }
    
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    th { background-color: #f8fafc; font-weight: 600; color: #475569; }
    tr:hover { background-color: #f1f5f9; }
    .badge-grade { font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #e2e8f0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Projection de Cote & Dépréciation (3, 6, 12, 24, 36 mois)</h1>

    <!-- Filtres de sélection -->
    <div class="card controls">
      <div class="control-group">
        <label for="manufacturerSelect">Constructeur / Marque :</label>
        <select id="manufacturerSelect">
          <option value="">-- Sélectionner une marque --</option>
        </select>
      </div>
      <div class="control-group">
        <label for="productSelect">Modèle / Produit :</label>
        <select id="productSelect" disabled>
          <option value="">-- Sélectionner un produit --</option>
        </select>
      </div>
    </div>

    <!-- BLOC MARQUE -->
    <div class="card my-4" id="brandChartContainer" style="display: none;">
      <h2 id="brandTitle"></h2>
      <p id="brandRateInfo" style="font-weight: bold; color: #3b82f6; margin-bottom: 15px;"></p>
      <div style="height: 350px;">
        <canvas id="brandDepreciationChart"></canvas>
      </div>
    </div>

    <!-- BLOC PRODUIT -->
    <div class="card my-4" id="productChartContainer" style="display: none;">
      <h2 id="selectedProductTitle"></h2>
      <h4 id="productSubTitle" style="color: #64748b; margin-bottom: 15px;">Courbes de dépréciation par Grade</h4>
      <div style="height: 350px;">
        <canvas id="depreciationChart"></canvas>
      </div>
    </div>

    <!-- Tableau récapitulatif des projections -->
    <div class="card">
      <h2>Projections estimées par Grade</h2>
      <div class="table-container">
        <table id="projectionsTable">
          <thead>
            <tr>
              <th>Grade</th>
              <th>Prix Actuel</th>
              <th>Projection 12 mois</th>
              <th>Projection 24 mois</th>
              <th>Projection 36 mois</th>
              <th>Taux de baisse annuel moyen</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="6" style="text-align:center; color:#94a3b8;">Veuillez sélectionner un produit pour afficher les projections.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
