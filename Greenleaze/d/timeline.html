<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Analyse Argus Produit — Comparecycle</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function TimelineApp() {
      const [data09, setData09] = useState([]);
      const [selectedId, setSelectedId] = useState("44888"); // Produit par défaut : 44888
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedGrade, setSelectedGrade] = useState("A");
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);

      // Gestion de la Clé API et de l'analyse IA
      const [apiKey, setApiKey] = useState("");
      const [aiAnalysis, setAiAnalysis] = useState(null);
      const [loadingAi, setLoadingAi] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const dropdownRef = useRef(null);
      const inputRef = useRef(null);

      const gradesList = ["A", "B", "C", "D-"];
      const targetHorizons = ["+3M", "+6M", "+12M", "+24M", "+36M"];
      const allMonths = Array.from({ length: 37 }, (_, i) => `M${i}`);

      // Chargement du fichier de données
      useEffect(() => {
        fetch("timeline_data_09.json")
          .then((res) => res.json())
          .then((data) => {
            setData09(data);
            const defaultProd = data.find((p) => p.idproduct === "44888");
            if (defaultProd) {
              setSearchTerm(`${defaultProd.product} (${defaultProd.idproduct})`);
            }
          })
          .catch(() => setData09([]));
      }, []);

      // Liste unique des produits pour la recherche prédictive
      const productsList = useMemo(() => {
        const uniqueMap = new Map();
        data09.forEach((item) => {
          if (!uniqueMap.has(item.idproduct)) {
            uniqueMap.set(item.idproduct, {
              id: item.idproduct,
              name: item.product,
              brand: item.manufacturer,
              launchDate: item.launch_date
            });
          }
        });
        return Array.from(uniqueMap.values()).sort((a, b) => new Date(a.launchDate) - new Date(b.launchDate));
      }, [data09]);

      // Filtrage du sélecteur
      const filteredProducts = useMemo(() => {
        if (!searchTerm.trim()) return productsList;
        const selectedProd = productsList.find((p) => p.id === selectedId);
        const selectedString = selectedProd ? `${selectedProd.name} (${selectedProd.id})` : "";
        if (searchTerm === selectedString) return productsList;

        const term = searchTerm.toLowerCase();
        return productsList.filter(
          (p) => p.name.toLowerCase().includes(term) || p.id.toLowerCase().includes(term)
        );
      }, [productsList, searchTerm, selectedId]);

      // Fermeture du dropdown au clic extérieur
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsDropdownOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      // Récupération de l'item actif
      const currentItem = useMemo(() => {
        return data09.find((i) => i.idproduct === selectedId && i.grade === selectedGrade) || null;
      }, [data09, selectedId, selectedGrade]);

      // Analyse du produit par Gemini
      const analyzeWithGemini = async () => {
        if (!apiKey) {
          alert("Veuillez saisir votre clé API Gemini.");
          return;
        }
        if (!currentItem) return;

        setLoadingAi(true);

        const prompt = `
Cherche sur le web les prix de reprise / trade-in actuels en France pour ce smartphone :
- Nom : ${currentItem.product}
- Prix de lancement initial P0 : ${currentItem.p0} €
- Grade état : ${currentItem.grade}

Trouve les offres de reprise actuelles chez les concurrents français (ex: Back Market, Recommerce, Orange, Apple Trade-in, Bouygues, Fnac, Cash Converters).

Donne-moi une réponse sous forme d'un objet JSON strict (sans balises markdown) :
{
  "current_tradein_price": <prix_moyen_ou_max_trouve_en_nombre>,
  "current_discount_pct": <pourcentage_de_decote_par_rapport_a_p0_en_nombre>,
  "ai_projection_text": "<courte synthèse indiquant les sources/concurrents trouvés et leurs prix de reprise>"
}
        `;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              tools: [{ google_search: {} }]
            })
          });

          const data = await response.json();
          const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
          const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
          
          if (jsonMatch) {
            setAiAnalysis(JSON.parse(jsonMatch[0]));
          } else {
            setAiAnalysis({
              current_tradein_price: "-",
              current_discount_pct: "-",
              ai_projection_text: "Impossible de structurer la réponse web."
            });
          }
        } catch (err) {
          setAiAnalysis({
            current_tradein_price: "-",
            current_discount_pct: "-",
            ai_projection_text: "Erreur lors de la recherche web."
          });
        }
        setLoadingAi(false);
      };

      // Rendu de la Courbe dédiée au Produit Unique
      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext("2d");
        if (chartInstance.current) chartInstance.current.destroy();

        if (!currentItem || !currentItem.monthly_data) return;

        const realPriceData = new Array(37).fill(null);
        const projPriceData = new Array(37).fill(null);

        currentItem.monthly_data.forEach((mObj) => {
          const mNum = mObj.month;
          if (mNum > 36) return;

          if (mObj.price !== null) {
            if (mObj.isReal) {
              realPriceData[mNum] = mObj.price;
            } else {
              projPriceData[mNum] = mObj.price;
            }
          }
        });

        chartInstance.current = new Chart(ctx, {
          type: "line",
          data: {
            labels: allMonths,
            datasets: [
              {
                label: "Prix Réel (€)",
                data: realPriceData,
                borderColor: "#059669",
                backgroundColor: "#059669",
                borderWidth: 3,
                spanGaps: true,
                tension: 0.2,
                pointRadius: 4,
                pointHoverRadius: 6
              },
              {
                label: "Prix Projeté / Calculé (€)",
                data: projPriceData,
                borderColor: "#2563eb",
                backgroundColor: "#2563eb",
                borderWidth: 2,
                borderDash: [5, 5],
                spanGaps: true,
                tension: 0.2,
                pointRadius: 3,
                pointHoverRadius: 5
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "top",
                labels: { color: "#334155", font: { size: 12 }, boxWidth: 15 }
              },
              tooltip: {
                callbacks: { label: (context) => `${context.dataset.label}: ${context.raw} €` }
              }
            },
            scales: {
              x: { grid: { color: "#e2e8f0" }, ticks: { color: "#64748b" } },
              y: { grid: { color: "#e2e8f0" }, ticks: { color: "#64748b", callback: (v) => `${v} €` } }
            }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [currentItem]);

      const handleSelect = (prod) => {
        setSelectedId(prod.id);
        setSearchTerm(`${prod.name} (${prod.id})`);
        setIsDropdownOpen(false);
        setAiAnalysis(null);
      };

      return (
        <div className="max-w-5xl mx-auto p-6 space-y-6">
          {/* Header */}
          <header className="flex justify-between items-center border-b border-slate-200 pb-4 flex-wrap gap-4">
            <div>
              <h1 className="text-xl font-bold text-emerald-700">Analyse Argus Produit</h1>
              <p className="text-slate-500 text-xs">Suivi individuel des prix de reprise et projections de décote</p>
            </div>

            {/* Clé API Gemini */}
            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
              <span className="text-xs text-slate-500 font-medium">Clé API Gemini :</span>
              <input
                type="password"
                placeholder="AIzaSy..."
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                className="bg-slate-50 border border-slate-200 px-2 py-1 rounded text-xs text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-600 w-40"
              />
            </div>
          </header>

          {/* Barre de Recherche & Sélecteur Produit */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative" ref={dropdownRef}>
            <label className="block text-xs font-semibold text-slate-600 mb-1.5">
              Sélectionner un produit (pré-rempli avec ID 44888)
            </label>
            <div className="relative">
              <input
                ref={inputRef}
                type="text"
                placeholder="Tapez le nom ou l'ID du produit..."
                value={searchTerm}
                onFocus={() => setIsDropdownOpen(true)}
                onChange={(e) => {
                  setSearchTerm(e.target.value);
                  setIsDropdownOpen(true);
                }}
                className="w-full bg-slate-50 border border-slate-200 p-3 pr-10 rounded-lg text-sm text-slate-900 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-600"
              />
              {searchTerm && (
                <button
                  onClick={() => {
                    setSearchTerm("");
                    setSelectedId("");
                    setIsDropdownOpen(true);
                    setAiAnalysis(null);
                    if (inputRef.current) inputRef.current.focus();
                  }}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-sm font-bold"
                  title="Effacer la sélection"
                >
                  ✕
                </button>
              )}
            </div>

            {/* Liste Déroulante */}
            {isDropdownOpen && (
              <div className="absolute z-50 left-0 right-0 mt-2 max-h-60 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-xl divide-y divide-slate-100">
                {filteredProducts.length > 0 ? (
                  filteredProducts.map((p) => (
                    <div
                      key={p.id}
                      onClick={() => handleSelect(p)}
                      className={`p-3 text-sm hover:bg-slate-50 cursor-pointer flex justify-between items-center ${
                        p.id === selectedId ? "bg-emerald-50 text-emerald-800 font-semibold" : "text-slate-700"
                      }`}
                    >
                      <span>{p.name}</span>
                      <span className="text-xs font-mono text-slate-500 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                        ID: {p.id}
                      </span>
                    </div>
                  ))
                ) : (
                  <div className="p-3 text-xs text-slate-400 text-center">Aucun produit trouvé</div>
                )}
              </div>
            )}
          </div>

          {/* Synthèse du Produit Sélectionné */}
          {currentItem ? (
            <div className="space-y-6">
              {/* Carte Principale : Métadonnées */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center flex-wrap gap-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-900">{currentItem.product}</h2>
                  <p className="text-xs text-slate-500 mt-0.5 font-mono">
                    Constructeur : <b className="text-slate-700">{currentItem.manufacturer}</b> | ID : <b className="text-slate-700">{currentItem.idproduct}</b>
                  </p>
                </div>

                <div className="flex gap-6 font-mono text-xs">
                  <div className="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-center">
                    <span className="text-slate-400 block text-[10px]">Lancement</span>
                    <b className="text-slate-700 text-sm">{new Date(currentItem.launch_date).toLocaleDateString("fr-FR")}</b>
                  </div>
                  <div className="bg-slate-50 px-4 py-2 rounded-lg border border-slate-200 text-center">
                    <span className="text-slate-400 block text-[10px]">Prix P0 Initial</span>
                    <b className="text-emerald-700 text-sm">{currentItem.p0} €</b>
                  </div>
                </div>
              </div>

              {/* Encart IA spécifique au produit */}
              <div className="bg-white p-5 rounded-xl border border-emerald-200 shadow-sm space-y-3">
                <div className="flex justify-between items-center flex-wrap gap-2">
                  <div>
                    <h3 className="text-sm font-bold text-emerald-800 flex items-center gap-2">
                      🔍 Recherche Web Concurrents (via Gemini)
                    </h3>
                    <p className="text-xs text-slate-500">Pointe les offres réelles de reprise sur le marché (Back Market, Orange, Apple...)</p>
                  </div>
                  <button
                    onClick={analyzeWithGemini}
                    disabled={loadingAi}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition-colors shadow-sm disabled:opacity-50"
                  >
                    {loadingAi ? "Recherche en cours..." : "Rechercher les prix web à date"}
                  </button>
                </div>

                {aiAnalysis && (
                  <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-center font-mono">
                    <div className="flex gap-6 text-xs">
                      <div>
                        <span className="text-slate-500 block">Prix Reprise Web :</span>
                        <b className="text-emerald-700 text-base">{aiAnalysis.current_tradein_price} €</b>
                      </div>
                      <div>
                        <span className="text-slate-500 block">Décote Web :</span>
                        <b className="text-rose-600 text-base">-{aiAnalysis.current_discount_pct} %</b>
                      </div>
                    </div>
                    <p className="text-xs text-slate-700 font-sans italic bg-white p-2.5 rounded border border-slate-200 flex-1 shadow-sm">
                      "{aiAnalysis.ai_projection_text}"
                    </p>
                  </div>
                )}
              </div>

              {/* Onglets Grade */}
              <div className="space-y-0">
                <div className="flex space-x-1 border-b border-slate-200 px-2">
                  {gradesList.map((g) => (
                    <button
                      key={g}
                      onClick={() => setSelectedGrade(g)}
                      className={`px-5 py-2.5 text-xs font-bold rounded-t-lg transition-colors border-t border-x ${
                        selectedGrade === g
                          ? "bg-white text-emerald-700 border-slate-200 border-b-white -mb-px z-10"
                          : "bg-slate-100 text-slate-500 border-transparent hover:bg-slate-200 hover:text-slate-800"
                      }`}
                    >
                      Grade {g}
                    </button>
                  ))}
                </div>

                <div className="bg-white rounded-b-xl rounded-tr-xl border border-slate-200 p-5 space-y-6 shadow-sm">
                  {/* Graphique unique */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">
                      Trajectoire de prix M0 à M36 (Grade {selectedGrade})
                    </h3>
                    <div className="h-72 w-full">
                      <canvas ref={chartRef}></canvas>
                    </div>
                  </div>

                  {/* Tableau Synthétique des Horizons */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">
                      Valeurs aux Horizons Clés
                    </h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-center text-xs whitespace-nowrap border-collapse">
                        <thead className="bg-slate-50 text-slate-500 border-b border-slate-200">
                          <tr>
                            {targetHorizons.map((h) => (
                              <th key={h} className="p-3">{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody className="font-mono divide-x divide-slate-200 border-b border-slate-200">
                          <tr>
                            {targetHorizons.map((hLabel) => {
                              const hObj = currentItem.horizons ? currentItem.horizons.find((h) => h.monthLabel === hLabel) : null;

                              if (!hObj || hObj.price === null) {
                                return <td key={hLabel} className="p-4 text-slate-400">-</td>;
                              }

                              const varStr = hObj.variationPct !== null ? `(${hObj.variationPct > 0 ? '+' : ''}${hObj.variationPct.toFixed(1)} %)` : "";

                              return (
                                <td key={hLabel} className="p-4 bg-slate-50/50">
                                  <div className={`font-bold text-sm ${hObj.isReal ? 'text-emerald-700' : 'text-blue-600'}`}>
                                    {hObj.price.toFixed(2)} €
                                  </div>
                                  <div className="text-[11px] text-slate-500 mt-1 font-normal">
                                    {varStr}
                                  </div>
                                </td>
                              );
                            })}
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="p-12 text-center text-slate-400 bg-white rounded-xl border border-slate-200 text-sm shadow-sm">
              Veuillez sélectionner un produit dans la liste pour afficher ses analyses.
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TimelineApp />);
  </script>
</body>
</html>
