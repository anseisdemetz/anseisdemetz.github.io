<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Timeline & Projections Argus</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function TimelineApp() {
      const [data09, setData09] = useState([]);
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedBrand, setSelectedBrand] = useState("ALL");
      const [selectedGrade, setSelectedGrade] = useState("A");
      
      // Gestion de la Clé API et des analyses IA
      const [apiKey, setApiKey] = useState("");
      const [aiAnalyses, setAiAnalyses] = useState({});
      const [loadingAi, setLoadingAi] = useState(false);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const gradesList = ["A", "B", "C", "D-"];
      const targetHorizons = ["+3M", "+6M", "+12M", "+24M", "+36M"];
      const allMonths = Array.from({ length: 37 }, (_, i) => `M${i}`);

      useEffect(() => {
        fetch("timeline_data_09.json")
          .then((res) => res.json())
          .then((data) => setData09(data))
          .catch(() => setData09([]));
      }, []);

      const brandsList = useMemo(() => {
        const brands = new Set();
        data09.forEach((item) => {
          if (item.manufacturer) brands.add(item.manufacturer);
        });
        return Array.from(brands).sort();
      }, [data09]);

      const filteredRows = useMemo(() => {
        return data09.filter((item) => {
          if (item.grade !== selectedGrade) return false;
          if (selectedBrand !== "ALL" && item.manufacturer !== selectedBrand) return false;
          if (searchTerm.trim()) {
            const term = searchTerm.toLowerCase();
            return item.product.toLowerCase().includes(term) || item.idproduct.toLowerCase().includes(term);
          }
          return true;
        }).sort((a, b) => new Date(a.launch_date || 0) - new Date(b.launch_date || 0));
      }, [data09, selectedGrade, selectedBrand, searchTerm]);

      // Sélection des 5 premiers produits
      const top5Products = useMemo(() => filteredRows.slice(0, 5), [filteredRows]);

      // Fonction d'appel à l'API Gemini avec Google Search Grounding
      const analyzeTop5WithGemini = async () => {
        if (!apiKey) {
          alert("Veuillez saisir votre clé API Gemini.");
          return;
        }

        setLoadingAi(true);
        const results = {};

        for (const item of top5Products) {
          const prompt = `
Cherche sur le web les prix de reprise / trade-in actuels en France pour ce smartphone :
- Nom : ${item.product}
- Prix de lancement initial P0 : ${item.p0} €
- Grade état : ${item.grade}

Trouve les offres de reprise actuelles chez les concurrents français (ex: Back Market, Recommerce, Orange, Apple Trade-in, Bouygues, Fnac, Cash Converters).

Donne-moi une réponse sous forme d'un objet JSON strict (sans balises markdown) :
{
  "current_tradein_price": <prix_moyen_ou_max_trouve_en_nombre>,
  "current_discount_pct": <pourcentage_de_decote_par_rapport_a_p0_en_nombre>,
  "ai_projection_text": "<courte synthèse indiquant les sources/concurrents trouves et leurs prix de reprise>"
}
          `;

          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                tools: [
                  { google_search: {} } // Activation de la recherche Web en direct
                ]
              })
            });

            const data = await response.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
            
            // Extraction sécurisée du JSON
            const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              results[item.idproduct] = JSON.parse(jsonMatch[0]);
            } else {
              results[item.idproduct] = {
                current_tradein_price: "-",
                current_discount_pct: "-",
                ai_projection_text: "Impossible de structurer la réponse web."
              };
            }
          } catch (err) {
            results[item.idproduct] = {
              current_tradein_price: "-",
              current_discount_pct: "-",
              ai_projection_text: "Erreur lors de la recherche Web."
            };
          }
        }

        setAiAnalyses(results);
        setLoadingAi(false);
      };

      const getColor = (index) => {
        const colors = ["#10b981", "#3b82f6", "#f59e0b", "#ec4899", "#8b5cf6", "#06b6d4", "#f97316", "#14b8a6", "#6366f1", "#a855f7"];
        return colors[index % colors.length];
      };

      // Courbe des Prix Moyens (€)
      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext("2d");
        if (chartInstance.current) chartInstance.current.destroy();

        const datasets = [];

        filteredRows.forEach((item, idx) => {
          if (!item.monthly_data) return;

          const baseColor = getColor(idx);
          const realPriceData = new Array(37).fill(null);
          const projPriceData = new Array(37).fill(null);

          item.monthly_data.forEach((mObj) => {
            const mNum = mObj.month;
            if (mNum > 36) return;

            if (mObj.price !== null) {
              if (mObj.isReal) {
                realPriceData[mNum] = mObj.price;
              } else {
                projPriceData[mNum] = mObj.price;
              }
            }
          });

          datasets.push({
            label: `${item.product} (Réel)`,
            data: realPriceData,
            borderColor: baseColor,
            backgroundColor: baseColor,
            borderWidth: 2.5,
            spanGaps: true,
            tension: 0.2,
            pointRadius: 3
          });

          datasets.push({
            label: `${item.product} (Projeté)`,
            data: projPriceData,
            borderColor: baseColor,
            backgroundColor: baseColor,
            borderWidth: 1.8,
            borderDash: [5, 5],
            spanGaps: true,
            tension: 0.2,
            pointRadius: 2
          });
        });

        chartInstance.current = new Chart(ctx, {
          type: "line",
          data: { labels: allMonths, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: "bottom", labels: { color: "#94a3b8", font: { size: 10 }, boxWidth: 12 } },
              tooltip: { callbacks: { label: (context) => `${context.dataset.label}: ${context.raw} €` } }
            },
            scales: {
              x: { grid: { color: "#1e293b" }, ticks: { color: "#94a3b8" } },
              y: { grid: { color: "#1e293b" }, ticks: { color: "#94a3b8", callback: (v) => `${v} €` } }
            }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [filteredRows]);

      return (
        <div className="max-w-7xl mx-auto p-6 space-y-8">
          <header className="border-b border-slate-800 pb-4 flex justify-between items-center flex-wrap gap-4">
            <div>
              <h1 className="text-2xl font-bold text-emerald-400">Projections & Valorisation Argus</h1>
              <p className="text-slate-400 text-sm">Évolution mensuelle des prix et horizons de valorisation (données de Septembre)</p>
            </div>

            {/* Saisie Sécurisée de la Clé API Gemini */}
            <div className="flex items-center gap-2 bg-slate-800 p-2 rounded-lg border border-slate-700">
              <span className="text-xs text-slate-400 font-semibold">Clé Gemini :</span>
              <input
                type="password"
                placeholder="AIzaSy..."
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                className="bg-slate-900 border border-slate-700 px-2.5 py-1 rounded text-xs text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 w-44"
              />
            </div>
          </header>

          {/* Encart IA : Recherche Concurrents Web (Top 5) */}
          <div className="bg-slate-950 p-5 rounded-xl border border-emerald-900/50 shadow-xl space-y-4">
            <div className="flex justify-between items-center flex-wrap gap-2">
              <div>
                <h2 className="text-sm font-bold text-emerald-400 flex items-center gap-2">
                  🔍 Prix Concurrents Web en direct (Top 5 Produits)
                </h2>
                <p className="text-xs text-slate-400">Recherche web en temps réel des offres de reprise chez la concurrence (via Gemini Grounding)</p>
              </div>
              <button
                onClick={analyzeTop5WithGemini}
                disabled={loadingAi}
                className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition-colors disabled:opacity-50"
              >
                {loadingAi ? "Recherche Web en cours..." : "Lancer la recherche Concurrents"}
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-5 gap-3 font-sans">
              {top5Products.map((p) => {
                const aiData = aiAnalyses[p.idproduct];
                return (
                  <div key={p.idproduct} className="bg-slate-900 p-3 rounded-lg border border-slate-800 flex flex-col justify-between">
                    <div>
                      <div className="font-semibold text-xs text-slate-200 truncate">{p.product}</div>
                      <div className="text-[10px] font-mono text-slate-500">ID: {p.idproduct}</div>
                    </div>

                    <div className="mt-3 space-y-1.5 font-mono">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-slate-400">Reprise Web :</span>
                        <span className="font-bold text-emerald-400">{aiData?.current_tradein_price ? `${aiData.current_tradein_price} €` : "-"}</span>
                      </div>
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-slate-400">Décote Web :</span>
                        <span className="font-bold text-rose-400">{aiData?.current_discount_pct ? `-${aiData.current_discount_pct}%` : "-"}</span>
                      </div>
                    </div>

                    {aiData?.ai_projection_text && (
                      <div className="mt-2 text-[10px] text-slate-400 bg-slate-950 p-1.5 rounded border border-slate-800/80 leading-tight">
                        {aiData.ai_projection_text}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Filtres */}
          <div className="flex flex-col md:flex-row gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div className="flex-1">
              <label className="block text-xs font-medium text-slate-400 mb-1">Filtrer par Produit ou ID</label>
              <input
                type="text"
                placeholder="Rechercher 'iPhone 16' ou '44882'..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
              />
            </div>
            <div className="w-full md:w-64">
              <label className="block text-xs font-medium text-slate-400 mb-1">Filtrer par Marque</label>
              <select
                value={selectedBrand}
                onChange={(e) => setSelectedBrand(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium"
              >
                <option value="ALL">Toutes les marques ({brandsList.length})</option>
                {brandsList.map((b) => <option key={b} value={b}>{b}</option>)}
              </select>
            </div>
          </div>

          {/* Graphique */}
          <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 shadow-xl space-y-3">
            <h2 className="text-sm font-semibold text-slate-200">Courbe de Progression des Prix Moyen par Mois (M0 à M36)</h2>
            <div className="h-72 w-full"><canvas ref={chartRef}></canvas></div>
          </div>

          {/* Onglets + Tableau */}
          <div className="space-y-0">
            <div className="flex space-x-1 border-b border-slate-800 px-2">
              {gradesList.map((g) => (
                <button
                  key={g}
                  onClick={() => setSelectedGrade(g)}
                  className={`px-5 py-2.5 text-xs font-bold rounded-t-lg transition-colors border-t border-x ${
                    selectedGrade === g
                      ? "bg-slate-950 text-emerald-400 border-slate-800 border-b-slate-950 -mb-px z-10"
                      : "bg-slate-900/60 text-slate-400 border-transparent hover:bg-slate-800 hover:text-slate-200"
                  }`}
                >
                  Grade {g}
                </button>
              ))}
            </div>

            <div className="bg-slate-950 rounded-b-xl rounded-tr-xl border border-slate-800 shadow-xl overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs whitespace-nowrap">
                  <thead className="bg-slate-900/60 text-slate-400 border-b border-slate-800">
                    <tr>
                      <th className="p-3.5 min-w-[260px]">Produit</th>
                      {targetHorizons.map((h) => (
                        <th key={h} className="p-3.5 text-center min-w-[130px]">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 font-mono">
                    {filteredRows.map((item) => (
                      <tr key={item.idproduct} className="hover:bg-slate-900/40">
                        <td className="p-3.5 font-sans">
                          <div className="font-semibold text-slate-100 text-sm">
                            {item.product} <span className="text-slate-500 text-xs font-mono">({item.idproduct})</span>
                          </div>
                          <div className="text-[11px] text-slate-400 font-mono mt-0.5 flex gap-3">
                            <span>Lancement : {new Date(item.launch_date).toLocaleDateString("fr-FR")}</span>
                            <span>Prix : <b className="text-slate-300">{item.p0} €</b></span>
                          </div>
                        </td>

                        {targetHorizons.map((hLabel) => {
                          const hObj = item.horizons ? item.horizons.find((h) => h.monthLabel === hLabel) : null;

                          if (!hObj || hObj.price === null) {
                            return <td key={hLabel} className="p-3.5 text-center text-slate-600 font-semibold">-</td>;
                          }

                          const varStr = hObj.variationPct !== null ? `(${hObj.variationPct > 0 ? '+' : ''}${hObj.variationPct.toFixed(1)} %)` : "";

                          return (
                            <td key={hLabel} className="p-3.5 text-center">
                              <div className={`font-bold ${hObj.isReal ? 'text-emerald-400' : 'text-blue-400'}`}>
                                {hObj.price.toFixed(2)} €
                              </div>
                              <div className="text-[11px] text-slate-400 font-normal mt-0.5">
                                {varStr}
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TimelineApp />);
  </script>
</body>
</html>
