<script>
    let scores = { q1: 0, q2: 0, q3: 0, q4: 0, q5: 0 };

    const gradesMap = [
        { code: "A", name: "Comme neuf", desc: "Aucun défaut. Aucune marque ni rayure.", color: "text-emerald-600" },
        { code: "A-", name: "Excellent", desc: "Très légères traces, invisibles à 20cm.", color: "text-emerald-500" },
        { code: "B", name: "Très bon état", desc: "Traces légères, micro-rayures fines.", color: "text-emerald-400" },
        { code: "C", name: "Bon état", desc: "Rayures visibles ou petits impacts légers.", color: "text-amber-500" },
        { code: "C-", name: "État moyen", desc: "Rayures plus nombreuses et marquées.", color: "text-amber-600" },
        { code: "D", name: "Très abîmé", desc: "Impacts ou rayures importantes.", color: "text-rose-500" },
        { code: "D-", name: "Endommagé", desc: "Élément brisé mais appareil fonctionnel.", color: "text-rose-700" }
    ];

    function selectCategory(catKey) {
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.className = "cat-btn flex-1 min-w-[105px] py-2.5 px-3 rounded-xl border-2 border-transparent bg-emerald-50/40 text-emerald-700 font-bold text-xs flex flex-col items-center gap-1.5 transition-all shadow-sm";
        });
        const activeBtn = document.getElementById('cat-' + catKey);
        if (activeBtn) {
            activeBtn.className = "cat-btn flex-1 min-w-[105px] py-2.5 px-3 rounded-xl border-2 border-emerald-500 bg-emerald-50/40 text-emerald-700 font-bold text-xs flex flex-col items-center gap-1.5 transition-all shadow-sm";
        }
    }

    function setScore(qNum, value) {
        scores['q' + qNum] = value;
        updateCardStyles(qNum);
        calculateGrade();
    }

    function updateCardStyles(qNum) {
        const labels = document.querySelectorAll(`.q${qNum}-opt`);
        labels.forEach(lbl => {
            const radio = lbl.querySelector('input[type="radio"]');
            if (radio && radio.checked) {
                lbl.className = lbl.className.replace(/border-slate-200|bg-white/g, 'border-emerald-500 bg-emerald-50/30 shadow-sm');
            } else {
                lbl.className = lbl.className.replace(/border-emerald-500|bg-emerald-50\/30|shadow-sm/g, 'border-slate-200 bg-white');
            }
        });
    }

    function calculateGrade() {
        const totalPenalties = scores.q1 + scores.q2 + scores.q3 + scores.q4 + scores.q5;
        let gradeIdx = Math.min(totalPenalties, gradesMap.length - 1);
        
        const res = gradesMap[gradeIdx];
        const badge = document.getElementById('gradeBadge');
        const gName = document.getElementById('gradeName');
        const gDesc = document.getElementById('gradeDesc');

        if (badge) {
            badge.innerText = res.code;
            badge.className = `text-5xl font-black ${res.color} leading-none mt-1 transition-all duration-300 scale-105`;
            setTimeout(() => badge.classList.remove('scale-105'), 200);
        }
        if (gName) gName.innerText = res.name;
        if (gDesc) gDesc.innerText = res.desc;
    }

    function setBestAnswers() {
        for (let i = 1; i <= 5; i++) {
            const firstRadio = document.querySelectorAll(`input[name="q${i}"]`)[0];
            if (firstRadio) {
                firstRadio.checked = true;
                scores['q' + i] = 0;
                updateCardStyles(i);
            }
        }
        calculateGrade();
    }

    function setWorstAnswers() {
        const worstVals = { q1: 4, q2: 3, q3: 3, q4: 3, q5: 3 };
        for (let i = 1; i <= 5; i++) {
            const radios = document.querySelectorAll(`input[name="q${i}"]`);
            const lastRadio = radios[radios.length - 1];
            if (lastRadio) {
                lastRadio.checked = true;
                scores['q' + i] = worstVals['q' + i];
                updateCardStyles(i);
            }
        }
        calculateGrade();
    }

    calculateGrade();
</script>
