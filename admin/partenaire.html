<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompaRecycle Argus - Partner Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.5); backdrop-filter: blur(2px); }
    </style>
</head>
<body class="h-full font-sans text-slate-800 antialiased flex flex-col overflow-hidden">

    <!-- TOP HEADER -->
    <header class="h-16 bg-white border-b border-slate-200 px-4 lg:px-6 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <img src="img/logo.png" alt="CompaRecycle" class="h-8 object-contain" onerror="this.style.display='none'">
                <span class="text-sm font-bold text-slate-800">CompaRecycle</span>
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest pl-2 border-l border-slate-300">by FLiP TECHNOLOGIES</span>
            </div>
            <span class="ml-4 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online
            </span>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 border-r border-slate-200 pr-4">
                <button class="w-6 h-4 rounded overflow-hidden shadow-sm hover:opacity-80 transition" title="Français">
                    <img src="https://flagcdn.com/w40/fr.png" alt="FR" class="w-full h-full object-cover">
                </button>
                <button class="w-6 h-4 rounded overflow-hidden shadow-sm hover:opacity-80 transition opacity-60" title="English">
                    <img src="https://flagcdn.com/w40/gb.png" alt="GB" class="w-full h-full object-cover">
                </button>
            </div>

            <div class="relative group">
                <button id="userMenuBtn" onclick="toggleUserDropdown()" class="flex items-center space-x-3 cursor-pointer focus:outline-none">
                    <div class="w-9 h-9 rounded-full bg-slate-800 text-white flex items-center justify-center font-semibold text-sm shadow-sm group-hover:bg-slate-700 transition">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div class="hidden md:block text-left">
                        <div class="text-xs font-bold text-slate-800 uppercase leading-none">FLIP TECHNOLOGIES</div>
                        <div class="text-[10px] text-slate-400 font-medium">Administrateur</div>
                    </div>
                    <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform duration-200" id="userMenuChevron"></i>
                </button>
                <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-200 py-1 z-30">
                    <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-xs font-semibold text-rose-600 hover:bg-rose-50 transition">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i> Déconnexion
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER (SIDEBAR + CONTENT) -->
    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="w-60 bg-[#1e293b] text-slate-300 flex flex-col shrink-0 overflow-y-auto transition-all duration-300">
            <div class="p-3 flex items-center justify-between border-b border-slate-700/50 shrink-0">
                <span class="sidebar-text text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Navigation</span>
                <button onclick="toggleSidebar()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i id="collapseIcon" class="fa-solid fa-chevron-left text-xs transition-transform duration-300"></i>
                </button>
            </div>

                        <nav class="p-3 space-y-1 text-sm font-medium">
                <a href="#" onclick="loadPage('pages/tableau-de-bord.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-chart-pie w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Tableau de bord</span>
                </a>
                <a href="#" onclick="loadPage('pages/transactions.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-list-check w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Transactions</span>
                </a>
                <a href="#" id="defaultNavBtn" onclick="loadPage('pages/argus.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl bg-emerald-600 text-white font-semibold shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid fa-tags w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Argus</span>
                </a>
                <a href="#" onclick="loadPage('pages/facturation.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-file-invoice-dollar w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Facturation</span>
                </a>
                <a href="#" onclick="loadPage('pages/expedition.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-truck-fast w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Expédition</span>
                </a>
                <a href="#" onclick="loadPage('pages/simulateur.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-calculator w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Simulateur</span>
                </a>
                <a href="#" onclick="loadPage('pages/cle-api.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-key w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Clé Api</span>
                </a>
                <a href="#" onclick="loadPage('pages/documentation.html', this); return false;" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <i class="fa-solid fa-book-open w-5 text-center shrink-0"></i>
                    <span class="sidebar-text truncate">Documentation & guides</span>
                </a>
            </nav>

            <div class="mt-auto p-4 border-t border-slate-700/50 text-xs text-slate-500 text-center sidebar-text">
                v3.4.12 &bull; Partner Portal
            </div>
        </aside>

        <!-- DYNAMIC CONTENT CONTAINER -->
        <main id="main-content" class="flex-1 bg-slate-50 flex flex-col min-w-0 overflow-y-auto p-6">
            <!-- Dynamic page loaded here -->
        </main>
    </div>

    <!-- GLOBAL DATA & CORE ENGINE SCRIPT -->
    <script>
        let GLOBAL_DATA = {};

        async function initData() {
            try {
                const res = await fetch('data/mock-data.json');
                if (res.ok) {
                    GLOBAL_DATA = await res.json();
                }
            } catch (e) {
                console.warn("Erreur chargement mock-data.json:", e);
            }
        }

        async function loadPage(pageUrl, linkElement) {
            const mainContent = document.getElementById('main-content');

            document.querySelectorAll('.nav-item').forEach(el => {
                el.className = "nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition";
            });
            if (linkElement) {
                linkElement.className = "nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl bg-emerald-600 text-white font-semibold shadow-lg shadow-emerald-900/30";
            }

            try {
                const response = await fetch(pageUrl);
                if (!response.ok) throw new Error("Page HTTP 404");
                const html = await response.text();
                mainContent.innerHTML = html;

                Array.from(mainContent.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (err) {
                console.warn("Impossible de charger la page:", pageUrl, err);
                mainContent.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm text-center my-auto">
                        <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500 mb-3"></i>
                        
                    </div>
                `;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const collapseIcon = document.getElementById('collapseIcon');
            if (!sidebar || !collapseIcon) return;
            const isCollapsed = sidebar.classList.contains('w-16');
            if (isCollapsed) {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-60');
                collapseIcon.classList.remove('rotate-180');
                document.querySelectorAll('.sidebar-text').forEach(el => el.classList.remove('hidden'));
            } else {
                sidebar.classList.remove('w-60');
                sidebar.classList.add('w-16');
                collapseIcon.classList.add('rotate-180');
                document.querySelectorAll('.sidebar-text').forEach(el => el.classList.add('hidden'));
            }
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            const chevron = document.getElementById('userMenuChevron');
            if (!dropdown) return;
            dropdown.classList.toggle('hidden');
            if (chevron) chevron.classList.toggle('rotate-180');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initData();
            const defaultNav = document.getElementById('defaultNavBtn');
            loadPage('pages/argus.html', defaultNav);
        });
    </script>
</body>
</html>
