<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Lecture 30 p/jour</title>
  
  <!-- Lien vers le Manifest PWA -->
    <link rel="manifest" href="manifest.json">

  <!-- Configuration PWA Mobile -->
  <!-- Configuration Thème et StatusBar Mobile -->
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="30Pages/J">


<!-- Favicon & Icône d'application iOS -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 style=%22background-color:%23FFFFFF;%22><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2260%22>📚</text></svg>">

  <!-- Tailwind CSS, Supabase SDK & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10 select-none overflow-x-hidden">

  <!-- Entête avec Statistiques & Bouton Liste Livres -->
  <header class="bg-indigo-600 text-white p-3 shadow-md sticky top-0 z-20">
    <div class="flex justify-between items-center mb-2">
      <div>
        <h1 class="font-bold text-base leading-tight">📚 Challenge 30 P/Jour</h1>
        <p class="text-[10px] text-indigo-200">1er Juil. 2026 – 30 Juin 2027</p>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="openBooksPanel()" class="text-xs bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-700 px-2.5 py-1 rounded-full font-semibold transition flex items-center space-x-1 border border-indigo-400">
          <span>📖 Livres</span>
          <span id="badge-books-count" class="bg-white text-indigo-700 text-[10px] px-1.5 py-0.2 rounded-full font-bold">0</span>
        </button>
        <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-bold">
          <span id="stat-days">0</span>/365 j
        </span>
      </div>
    </div>

    <!-- Barre d'outils statistiques -->
    <div class="grid grid-cols-2 gap-2 text-[11px] bg-indigo-700/60 p-2 rounded-lg border border-indigo-500/40">
      <div>
        <div class="text-indigo-200">Théorique: <span id="stat-theo-pages" class="font-bold text-white">0</span> / <span class="text-indigo-200 font-semibold">10 950 p.</span></div>
        <div class="text-indigo-200">Livres finis: <span id="stat-real-pages" class="font-bold text-white">0</span> p.</div>
      </div>
      <div class="border-l border-indigo-500/40 pl-2">
        <div class="text-indigo-200">Objectif Annuel: <span id="stat-percent" class="font-bold text-emerald-300">0%</span></div>
        <div class="text-[10px] text-indigo-100 truncate mt-0.5" id="stat-books-lang">
          FR: 0 | IT: 0 | EN: 0
        </div>
      </div>
    </div>
  </header>

  <!-- Filtre des mois -->
  <nav class="bg-white border-b px-4 py-2.5 flex space-x-2 overflow-x-auto text-sm sticky top-[108px] z-10 shadow-sm scroll-smooth" id="month-tabs"></nav>

  <!-- Grille du calendrier -->
  <main class="max-w-md mx-auto p-4">
    <div id="calendar-container" class="touch-pan-y">
      <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center transition-transform duration-200 ease-out"></div>
    </div>
  </main>

  <!-- Panneau Liste des Livres -->
  <div id="books-panel" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center p-0 sm:p-4 z-40 select-text">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-xl p-5 shadow-2xl max-h-[85vh] flex flex-col space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h3 class="font-bold text-lg text-gray-800">📖 Mes Livres</h3>
          <p class="text-xs text-gray-500">Liste et ordre de lecture du challenge</p>
        </div>
        <button onclick="closeBooksPanel()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2">&times;</button>
      </div>

      <!-- Filtres rapides -->
      <div class="flex space-x-2 text-xs border-b pb-2">
        <button onclick="filterBooks('all')" id="filter-btn-all" class="px-2.5 py-1 rounded-full font-medium bg-indigo-600 text-white">Tous</button>
        <button onclick="filterBooks('reading')" id="filter-btn-reading" class="px-2.5 py-1 rounded-full font-medium bg-gray-100 text-gray-600">En cours ({)</button>
        <button onclick="filterBooks('finished')" id="filter-btn-finished" class="px-2.5 py-1 rounded-full font-medium bg-gray-100 text-gray-600">Terminés (})</button>
      </div>

      <!-- Liste scrollable -->
      <div id="books-list" class="overflow-y-auto space-y-2.5 pr-1 flex-1"></div>
    </div>
  </div>

  <!-- Modal d'édition du jour -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 select-text">
    <div class="bg-white w-full max-w-sm rounded-xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="modal-date" class="font-bold text-gray-700">Détails du jour</h3>
        <button onclick="closeModal()" class="text-gray-400 text-xl font-bold">&times;</button>
      </div>

      <!-- Statut de lecture -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Objectif 30 pages</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setStatus('success')" id="btn-success" class="p-3 border rounded-lg text-lg flex items-center justify-center hover:bg-emerald-50">✅</button>
          <button onclick="setStatus('fail')" id="btn-fail" class="p-3 border rounded-lg text-lg flex items-center justify-center hover:bg-rose-50">❌</button>
          <button onclick="setStatus(null)" id="btn-none" class="p-3 border rounded-lg text-xs text-gray-500 flex items-center justify-center border-dashed">Effacer</button>
        </div>
      </div>

      <!-- Livres -->
      <div class="space-y-3 border-t pt-3">
        <label class="block text-xs font-semibold text-gray-500 uppercase">Événement Livre</label>
        
        <div class="flex items-center space-x-4">
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" id="input-start" class="w-4 h-4 text-indigo-600 rounded">
            <span>Début <code>{</code></span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" id="input-end" class="w-4 h-4 text-indigo-600 rounded">
            <span>Fin <code>}</code></span>
          </label>
        </div>

        <div class="space-y-2">
          <input type="text" id="input-title" placeholder="Titre du livre" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          <input type="text" id="input-author" placeholder="Auteur" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          
          <div class="grid grid-cols-2 gap-2">
            <select id="input-language" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="">Langue</option>
              <option value="Français">Français</option>
              <option value="Italien">Italien</option>
              <option value="Anglais">Anglais</option>
            </select>
            <input type="number" id="input-pages" placeholder="Nb de pages" min="1" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="saveDayData()" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    // Initialisation Supabase via APP_CONFIG (config.js)
    const SUPABASE_URL = window.APP_CONFIG.supabaseUrl;
    const SUPABASE_KEY = window.APP_CONFIG.supabaseKey;
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TOTAL_ANNUAL_TARGET_PAGES = 30 * 365; // 10 950 pages

    // Palette de couleurs pastel pour les plages de lecture dans le calendrier
    const BOOK_COLORS = [
      { bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300' },
      { bg: 'bg-sky-100', text: 'text-sky-800', border: 'border-sky-300' },
      { bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-300' },
      { bg: 'bg-purple-100', text: 'text-purple-800', border: 'border-purple-300' },
      { bg: 'bg-rose-100', text: 'text-rose-800', border: 'border-rose-300' },
      { bg: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-300' },
      { bg: 'bg-teal-100', text: 'text-teal-800', border: 'border-teal-300' },
      { bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-300' }
    ];

    let daysData = {};
    let booksListArray = [];
    let dateToBookMap = {};
    let activeBookFilter = 'all';
    let selectedDateStr = null;
    let currentStatus = null;
    let currentMonthIndex = 0;

    const monthsList = [
      { key: '2026-07', label: 'Juil 26' },
      { key: '2026-08', label: 'Août 26' },
      { key: '2026-09', label: 'Sept 26' },
      { key: '2026-10', label: 'Oct 26' },
      { key: '2026-11', label: 'Nov 26' },
      { key: '2026-12', label: 'Déc 26' },
      { key: '2027-01', label: 'Janv 27' },
      { key: '2027-02', label: 'Fév 27' },
      { key: '2027-03', label: 'Mars 27' },
      { key: '2027-04', label: 'Avr 27' },
      { key: '2027-05', label: 'Mai 27' },
      { key: '2027-06', label: 'Juin 27' }
    ];

    const today = new Date();
    const todayYear = today.getFullYear();
    const todayMonth = String(today.getMonth() + 1).padStart(2, '0');
    const todayDateStr = `${todayYear}-${todayMonth}-${String(today.getDate()).padStart(2, '0')}`;
    const todayMonthKey = `${todayYear}-${todayMonth}`;

    async function init() {
      const initialIdx = monthsList.findIndex(m => m.key === todayMonthKey);
      currentMonthIndex = (initialIdx !== -1) ? initialIdx : 0;

      renderTabs();
      await fetchSupabaseData();
      selectMonth(currentMonthIndex, false);
      setupSwipeEvents();
    }

    async function fetchSupabaseData() {
      const { data, error } = await supabaseClient.from('challenge_reader').select('*').order('day_date', { ascending: true });
      if (!error && data) {
        daysData = {};
        booksListArray = [];
        dateToBookMap = {};

        let successCount = 0;
        let realPagesTotal = 0;
        const langCounts = { 'Français': 0, 'Italien': 0, 'Anglais': 0, 'Autre': 0 };

        data.forEach(row => {
          daysData[row.day_date] = row;
          if (row.status === 'success') successCount++;
        });

        let openBook = null;
        let bookIndex = 0;

        data.forEach(row => {
          if (row.book_start) {
            if (openBook) {
              booksListArray.push(openBook);
              bookIndex++;
            }

            const color = BOOK_COLORS[bookIndex % BOOK_COLORS.length];
            openBook = {
              id: bookIndex + 1,
              startDate: row.day_date,
              endDate: null,
              title: row.book_title || 'Titre non renseigné',
              author: row.book_author || 'Auteur inconnu',
              language: row.book_language || 'Non spécifiée',
              pages: row.book_pages || null,
              color: color
            };
          }

          if (row.book_end) {
            if (openBook) {
              openBook.endDate = row.day_date;
              if (row.book_title) openBook.title = row.book_title;
              if (row.book_author) openBook.author = row.book_author;
              if (row.book_language) openBook.language = row.book_language;
              if (row.book_pages) openBook.pages = row.book_pages;

              booksListArray.push(openBook);
              openBook = null;
              bookIndex++;
            } else {
              const color = BOOK_COLORS[bookIndex % BOOK_COLORS.length];
              booksListArray.push({
                id: bookIndex + 1,
                startDate: row.day_date,
                endDate: row.day_date,
                title: row.book_title || 'Titre non renseigné',
                author: row.book_author || 'Auteur inconnu',
                language: row.book_language || 'Non spécifiée',
                pages: row.book_pages || null,
                color: color
              });
              bookIndex++;
            }
          }
        });

        if (openBook) {
          booksListArray.push(openBook);
        }

        booksListArray.forEach(book => {
          if (book.endDate) {
            if (book.pages) realPagesTotal += parseInt(book.pages, 10);
            if (book.language && langCounts.hasOwnProperty(book.language)) {
              langCounts[book.language]++;
            } else if (book.language) {
              langCounts['Autre']++;
            }
          }

          const start = new Date(book.startDate);
          const end = book.endDate ? new Date(book.endDate) : new Date('2027-06-30');

          let curr = new Date(start);
          while (curr <= end) {
            const dateStr = curr.toISOString().split('T')[0];
            dateToBookMap[dateStr] = {
              book: book,
              isStart: dateStr === book.startDate,
              isEnd: dateStr === book.endDate
            };
            curr.setDate(curr.getDate() + 1);
          }
        });

        const theoPages = successCount * 30;
        const progressPercent = ((theoPages / TOTAL_ANNUAL_TARGET_PAGES) * 100).toFixed(1);

        document.getElementById('stat-days').innerText = successCount;
        document.getElementById('stat-theo-pages').innerText = theoPages.toLocaleString('fr-FR');
        document.getElementById('stat-real-pages').innerText = realPagesTotal.toLocaleString('fr-FR');
        document.getElementById('stat-percent').innerText = `${progressPercent}%`;
        document.getElementById('stat-books-lang').innerText = `FR: ${langCounts['Français']} | IT: ${langCounts['Italien']} | EN: ${langCounts['Anglais']}`;
        document.getElementById('badge-books-count').innerText = booksListArray.length;
      }
    }

    function renderTabs() {
      const container = document.getElementById('month-tabs');
      container.innerHTML = '';
      
      monthsList.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.id = `tab-${idx}`;
        btn.className = `px-3 py-1 rounded-full whitespace-nowrap text-xs font-medium border transition-colors ${idx === currentMonthIndex ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-gray-50 text-gray-600 border-gray-200'}`;
        btn.innerText = m.label;
        btn.onclick = () => selectMonth(idx);
        container.appendChild(btn);
      });
    }

    function selectMonth(index, scrollTab = true) {
      currentMonthIndex = index;

      monthsList.forEach((_, idx) => {
        const btn = document.getElementById(`tab-${idx}`);
        if (btn) {
          if (idx === currentMonthIndex) {
            btn.className = 'px-3 py-1 rounded-full whitespace-nowrap text-xs font-medium border bg-indigo-600 text-white border-indigo-600';
            if (scrollTab) {
              btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
          } else {
            btn.className = 'px-3 py-1 rounded-full whitespace-nowrap text-xs font-medium border bg-gray-50 text-gray-600 border-gray-200';
          }
        }
      });

      renderCalendar(monthsList[currentMonthIndex].key);
    }

    function renderCalendar(yearMonth) {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const [y, m] = yearMonth.split('-').map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayData = daysData[dateStr] || {};
        const isToday = (dateStr === todayDateStr);

        const bookMapping = dateToBookMap[dateStr];
        const cell = document.createElement('div');

        let baseBg = 'bg-white';
        let customBorder = 'border-gray-200';

        if (bookMapping) {
          baseBg = bookMapping.book.color.bg;
          customBorder = bookMapping.book.color.border;
        }

        const todayStyle = isToday ? 'ring-2 ring-indigo-600 font-bold' : '';

        cell.className = `${baseBg} ${customBorder} ${todayStyle} p-1.5 rounded-lg border shadow-sm flex flex-col justify-between items-center h-20 cursor-pointer hover:opacity-90 relative transition-all`;
        cell.onclick = () => openModal(dateStr);

        let statusIcon = '';
        if (dayData.status === 'success') statusIcon = '<span class="text-emerald-600 text-base font-bold">✅</span>';
        if (dayData.status === 'fail') statusIcon = '<span class="text-rose-600 text-base font-bold">❌</span>';

        let bookBraces = '';
        if (bookMapping) {
          if (bookMapping.isStart && bookMapping.isEnd) {
            bookBraces = '{}';
          } else if (bookMapping.isStart) {
            bookBraces = '{';
          } else if (bookMapping.isEnd) {
            bookBraces = '}';
          }
        }

        cell.innerHTML = `
          <div class="text-xs font-bold ${isToday ? 'text-indigo-600' : 'text-gray-500'} w-full text-left flex justify-between items-center">
            <span>${d}</span>
            ${isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-indigo-600"></span>' : ''}
          </div>
          <div class="my-auto">${statusIcon}</div>
          ${bookBraces ? `<div class="text-xs font-extrabold ${bookMapping.book.color.text} px-1 rounded truncate max-w-full" title="${bookMapping.book.title}">${bookBraces}</div>` : '<div class="h-4"></div>'}
        `;
        grid.appendChild(cell);
      }
    }

    function openBooksPanel() {
      renderBooksList();
      document.getElementById('books-panel').classList.remove('hidden');
      document.getElementById('books-panel').classList.add('flex');
    }

    function closeBooksPanel() {
      document.getElementById('books-panel').classList.add('hidden');
      document.getElementById('books-panel').classList.remove('flex');
    }

    function filterBooks(type) {
      activeBookFilter = type;
      document.getElementById('filter-btn-all').className = `px-2.5 py-1 rounded-full font-medium ${type === 'all' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}`;
      document.getElementById('filter-btn-reading').className = `px-2.5 py-1 rounded-full font-medium ${type === 'reading' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}`;
      document.getElementById('filter-btn-finished').className = `px-2.5 py-1 rounded-full font-medium ${type === 'finished' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}`;
      renderBooksList();
    }

    function renderBooksList() {
      const listContainer = document.getElementById('books-list');
      listContainer.innerHTML = '';

      let filtered = booksListArray;
      if (activeBookFilter === 'reading') filtered = booksListArray.filter(b => b.endDate === null);
      if (activeBookFilter === 'finished') filtered = booksListArray.filter(b => b.endDate !== null);

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">Aucun livre trouvé dans cette catégorie.</p>`;
        return;
      }

      filtered.forEach((book) => {
        const startDateFormatted = new Date(book.startDate).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        const endDateFormatted = book.endDate ? new Date(book.endDate).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : 'En cours';

        let statusBadge = '';
        if (book.endDate) {
          statusBadge = `<span class="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">Terminé <code>}</code></span>`;
        } else {
          statusBadge = `<span class="bg-amber-100 text-amber-700 font-bold text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1">En cours <code>{</code></span>`;
        }

        const item = document.createElement('div');
        item.className = "bg-gray-50 border rounded-lg p-3 hover:border-indigo-300 transition flex items-start space-x-3 cursor-pointer";
        item.onclick = () => {
          closeBooksPanel();
          const bookMonthKey = book.startDate.substring(0, 7);
          const monthIdx = monthsList.findIndex(m => m.key === bookMonthKey);
          if (monthIdx !== -1) {
            selectMonth(monthIdx);
          }
          openModal(book.startDate);
        };

        item.innerHTML = `
          <div class="bg-indigo-600 text-white text-xs font-bold w-7 h-7 rounded-full flex items-center justify-center shrink-0">
            #${book.id}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start gap-1">
              <h4 class="font-bold text-sm text-gray-800 truncate">${book.title}</h4>
              ${statusBadge}
            </div>
            <p class="text-xs text-gray-600">${book.author}</p>
            <div class="flex flex-wrap items-center gap-2 text-[10px] text-gray-500 mt-1.5">
              <span>🌐 ${book.language}</span>
              ${book.pages ? `<span>• 📄 ${book.pages} p.</span>` : ''}
              <span>• 📅 ${startDateFormatted} → ${endDateFormatted}</span>
            </div>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function setupSwipeEvents() {
      const container = document.getElementById('calendar-container');
      let touchStartX = 0;
      let touchStartY = 0;

      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;

        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            if (currentMonthIndex < monthsList.length - 1) {
              selectMonth(currentMonthIndex + 1);
            } else {
              selectMonth(0);
            }
          } else {
            if (currentMonthIndex > 0) {
              selectMonth(currentMonthIndex - 1);
            }
          }
        }
      }, { passive: true });
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      const data = daysData[dateStr] || {};
      
      document.getElementById('modal-date').innerText = new Date(dateStr).toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      currentStatus = data.status || null;
      updateStatusUI();

      document.getElementById('input-start').checked = !!data.book_start;
      document.getElementById('input-end').checked = !!data.book_end;
      document.getElementById('input-title').value = data.book_title || '';
      document.getElementById('input-author').value = data.book_author || '';
      document.getElementById('input-language').value = data.book_language || '';
      document.getElementById('input-pages').value = data.book_pages || '';

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function setStatus(val) {
      currentStatus = val;
      updateStatusUI();
    }

    function updateStatusUI() {
      document.getElementById('btn-success').className = `p-3 border rounded-lg text-lg flex items-center justify-center ${currentStatus === 'success' ? 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-400' : ''}`;
      document.getElementById('btn-fail').className = `p-3 border rounded-lg text-lg flex items-center justify-center ${currentStatus === 'fail' ? 'border-rose-500 bg-rose-50 ring-2 ring-rose-400' : ''}`;
    }

    async function saveDayData() {
      const pagesVal = document.getElementById('input-pages').value;

      const payload = {
        day_date: selectedDateStr,
        status: currentStatus,
        book_start: document.getElementById('input-start').checked,
        book_end: document.getElementById('input-end').checked,
        book_title: document.getElementById('input-title').value || null,
        book_author: document.getElementById('input-author').value || null,
        book_language: document.getElementById('input-language').value || null,
        book_pages: pagesVal ? parseInt(pagesVal, 10) : null,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient.from('challenge_reader').upsert(payload);

      if (!error) {
        closeModal();
        await fetchSupabaseData();
        renderCalendar(monthsList[currentMonthIndex].key);
      } else {
        alert("Erreur d'enregistrement : " + error.message);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
