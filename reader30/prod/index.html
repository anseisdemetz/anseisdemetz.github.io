<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Lecture 30 p/jour</title>
  
  <!-- Configuration PWA Mobile -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="30Pages/Jour">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;: &quot;Challenge Lecture 30 Pages&quot;,
    &quot;short_name&quot;: &quot;30 Pages/J&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;%23f3f4f6&quot;,
    &quot;theme_color&quot;: &quot;%234f46e5&quot;,
    &quot;icons&quot;: [{
      &quot;src&quot;: &quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>&quot;,
      &quot;sizes&quot;: &quot;192x192 512x512&quot;,
      &quot;type&quot;: &quot;image/svg+xml&quot;
    }]
  }">

  <!-- Tailwind CSS & Supabase JS SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

  <!-- Entête -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg">📚 Challenge 30 Pages / Jour</h1>
      <p class="text-xs text-indigo-200">1er Juil. 2026 – 30 Juin 2027</p>
    </div>
    <div id="stats" class="text-right text-xs bg-indigo-700 px-3 py-1.5 rounded-lg">
      <div>Progression: <span id="stat-count" class="font-bold">0</span>/365</div>
    </div>
  </header>

  <!-- Filtre des mois -->
  <nav class="bg-white border-b px-4 py-3 flex space-x-2 overflow-x-auto text-sm sticky top-[60px] z-10 shadow-sm" id="month-tabs"></nav>

  <!-- Grille du calendrier -->
  <main class="max-w-md mx-auto p-4">
    <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center"></div>
  </main>

  <!-- Modal d'édition du jour -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-30">
    <div class="bg-white w-full max-w-sm rounded-xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="modal-date" class="font-bold text-gray-700">Détails du jour</h3>
        <button onclick="closeModal()" class="text-gray-400 text-xl font-bold">&times;</button>
      </div>

      <!-- Statut de lecture -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Objectif 30 pages</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setStatus('success')" id="btn-success" class="p-3 border rounded-lg text-lg flex items-center justify-center hover:bg-emerald-50">✅</button>
          <button onclick="setStatus('fail')" id="btn-fail" class="p-3 border rounded-lg text-lg flex items-center justify-center hover:bg-rose-50">❌</button>
          <button onclick="setStatus(null)" id="btn-none" class="p-3 border rounded-lg text-xs text-gray-500 flex items-center justify-center border-dashed">Effacer</button>
        </div>
      </div>

      <!-- Livres -->
      <div class="space-y-3 border-t pt-3">
        <label class="block text-xs font-semibold text-gray-500 uppercase">Événement Livre</label>
        
        <div class="flex items-center space-x-4">
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" id="input-start" class="w-4 h-4 text-indigo-600 rounded">
            <span>Début <code>{</code></span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" id="input-end" class="w-4 h-4 text-indigo-600 rounded">
            <span>Fin <code>}</code></span>
          </label>
        </div>

        <div class="space-y-2">
          <input type="text" id="input-title" placeholder="Titre du livre" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          <input type="text" id="input-author" placeholder="Auteur" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          <select id="input-language" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="">Sélectionner la langue</option>
            <option value="Français">Français</option>
            <option value="Italien">Italien</option>
            <option value="Anglais">Anglais</option>
          </select>
        </div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="saveDayData()" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration Supabase
    const SUPABASE_URL = "https://zugowxfbpbpcbqhznaeb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1Z293eGZicGJwY2JxaHpuYWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Njg0MjAsImV4cCI6MjEwMDQ0NDQyMH0.TUmghp2tmqWeXoK8x1P_wbC5ARMeMQ3Npw_AwN8dGb4";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let daysData = {};
    let selectedDateStr = null;
    let currentStatus = null;

    const startDate = new Date('2026-07-01');
    const endDate = new Date('2027-06-30');

    // Initialisation
    async function init() {
      renderTabs();
      await fetchSupabaseData();
      renderCalendar('2026-07');
    }

    // Récupération des données Supabase
    async function fetchSupabaseData() {
      const { data, error } = await supabaseClient.from('challenge_reader').select('*');
      if (!error && data) {
        daysData = {};
        let successCount = 0;
        data.forEach(row => {
          daysData[row.day_date] = row;
          if (row.status === 'success') successCount++;
        });
        document.getElementById('stat-count').innerText = successCount;
      }
    }

    // Rendu des onglets de mois
    function renderTabs() {
      const monthNames = ["Juil 26", "Août 26", "Sept 26", "Oct 26", "Nov 26", "Déc 26", "Janv 27", "Fév 27", "Mars 27", "Avr 27", "Mai 27", "Juin 27"];
      const container = document.getElementById('month-tabs');
      container.innerHTML = '';
      
      let curr = new Date(startDate);
      monthNames.forEach((name, idx) => {
        const year = curr.getFullYear();
        const month = String(curr.getMonth() + 1).padStart(2, '0');
        const key = `${year}-${month}`;

        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded-full whitespace-nowrap text-xs font-medium border ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-gray-50 text-gray-600'}`;
        btn.innerText = name;
        btn.onclick = () => {
          document.querySelectorAll('#month-tabs button').forEach(b => b.className = 'px-3 py-1 rounded-full whitespace-nowrap text-xs font-medium border bg-gray-50 text-gray-600');
          btn.className = 'px-3 py-1 rounded-full whitespace-nowrap text-xs font-medium border bg-indigo-600 text-white';
          renderCalendar(key);
        };
        container.appendChild(btn);
        curr.setMonth(curr.getMonth() + 1);
      });
    }

    // Rendu de la grille mensuelle
    function renderCalendar(yearMonth) {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const [y, m] = yearMonth.split('-').map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayData = daysData[dateStr] || {};

        const cell = document.createElement('div');
        cell.className = "bg-white p-2 rounded-lg border shadow-sm flex flex-col justify-between items-center h-20 cursor-pointer hover:border-indigo-400 relative";
        cell.onclick = () => openModal(dateStr);

        let statusIcon = '';
        if (dayData.status === 'success') statusIcon = '<span class="text-emerald-500 text-base font-bold">✅</span>';
        if (dayData.status === 'fail') statusIcon = '<span class="text-rose-500 text-base font-bold">❌</span>';

        let bookBraces = '';
        if (dayData.book_start) bookBraces += '{';
        if (dayData.book_end) bookBraces += '}';

        cell.innerHTML = `
          <div class="text-xs font-bold text-gray-400 w-full text-left">${d}</div>
          <div class="my-auto">${statusIcon}</div>
          ${bookBraces ? `<div class="text-xs font-bold text-indigo-600 bg-indigo-50 px-1 rounded truncate max-w-full" title="${dayData.book_title || ''}">${bookBraces}</div>` : ''}
        `;
        grid.appendChild(cell);
      }
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      const data = daysData[dateStr] || {};
      
      document.getElementById('modal-date').innerText = new Date(dateStr).toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      currentStatus = data.status || null;
      updateStatusUI();

      document.getElementById('input-start').checked = !!data.book_start;
      document.getElementById('input-end').checked = !!data.book_end;
      document.getElementById('input-title').value = data.book_title || '';
      document.getElementById('input-author').value = data.book_author || '';
      document.getElementById('input-language').value = data.book_language || '';

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    function setStatus(val) {
      currentStatus = val;
      updateStatusUI();
    }

    function updateStatusUI() {
      document.getElementById('btn-success').className = `p-3 border rounded-lg text-lg flex items-center justify-center ${currentStatus === 'success' ? 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-400' : ''}`;
      document.getElementById('btn-fail').className = `p-3 border rounded-lg text-lg flex items-center justify-center ${currentStatus === 'fail' ? 'border-rose-500 bg-rose-50 ring-2 ring-rose-400' : ''}`;
    }

    async function saveDayData() {
      const payload = {
        day_date: selectedDateStr,
        status: currentStatus,
        book_start: document.getElementById('input-start').checked,
        book_end: document.getElementById('input-end').checked,
        book_title: document.getElementById('input-title').value || null,
        book_author: document.getElementById('input-author').value || null,
        book_language: document.getElementById('input-language').value || null,
        updated_at: new Date().toISOString()
      };

      const { error } = await supabaseClient.from('challenge_reader').upsert(payload);

      if (!error) {
        closeModal();
        await fetchSupabaseData();
        const activeMonth = selectedDateStr.substring(0, 7);
        renderCalendar(activeMonth);
      } else {
        alert("Erreur d'enregistrement : " + error.message);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
