<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Lecture 30 p/jour</title>

  <!-- PWA Configuration -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="30Pages/J">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' style='background-color:%23FFFFFF;'><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='40'>📚</text></svg>">
  <!-- Favicon du site (icône PWA) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' style='background-color:%23FFFFFF;'><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='40'>📚</text></svg>">

  <!-- Style CSS séparé -->
  <link rel="stylesheet" href="style.css">

  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Configuration & Logiciel JS -->
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10 select-none overflow-x-hidden">

  <!-- En-tête de l'application -->
  <header class="bg-white text-gray-800 p-3 shadow-sm border-b sticky top-0 z-20">
    <div class="flex justify-between items-center mb-2">
      <div>
        <!-- [A024] Nouveau titre -->
        <h1 class="font-bold text-base leading-tight text-gray-900">📚 Lire 30 pages/jour</h1>
        <p class="text-[10px] text-gray-500">1er Juil. 2026 – 30 Juin 2027</p>
      </div>
      <div class="flex items-center space-x-2">
        <!-- [A023] Icône supprimée et structure inversée pour "N livre(s)" -->
        <button onclick="openBooksPanel()" class="text-xs bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 px-2.5 py-1 rounded-full font-semibold transition flex items-center border border-gray-300">
          <span id="badge-books-count">0 livre</span>
        </button>
        <span class="text-xs bg-gray-100 border text-gray-700 px-2.5 py-1 rounded-full font-bold">
          <span id="stat-days">0</span>/365 j
        </span>
      </div>
    </div>

    <!-- Tableau de bord statistique -->
    <div class="grid grid-cols-2 gap-2 text-[11px] bg-gray-50 p-2 rounded-lg border border-gray-200">
      <div>
        <div class="text-gray-500">Théorique: <span id="stat-theo-pages" class="font-bold text-gray-800">0</span> / <span class="text-gray-500 font-semibold">10 950 p.</span></div>
        <div class="text-gray-500">Livres finis: <span id="stat-real-pages" class="font-bold text-gray-800">0</span> p.</div>
        <div class="text-gray-500">Avance / Retard: <span id="stat-delta-pages" class="font-bold text-gray-600">0 p.</span></div>
      </div>
      <div class="border-l border-gray-200 pl-2 flex flex-col justify-between">
        <div>
          <div class="text-gray-500">Objectif Annuel: <span id="stat-percent" class="font-bold text-emerald-600">0%</span></div>
        </div>
        <div class="text-[10px] text-gray-500 truncate" id="stat-books-lang">
          FR: 0 | IT: 0 | EN: 0
        </div>
      </div>
    </div>
  </header>

  <!-- Filtre horizontal des mois -->
  <nav class="bg-white border-b px-4 py-2.5 flex space-x-2 overflow-x-auto text-sm sticky top-[125px] z-10 shadow-sm scroll-smooth hide-scrollbar" id="month-tabs"></nav>

  <!-- Grille du calendrier -->
  <main class="max-w-md mx-auto p-4">
    <div id="calendar-container" class="touch-pan-y">
      <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center transition-transform duration-200 ease-out"></div>
    </div>
  </main>

<!-- Drawer : Panneau de la Liste des Livres [A020], [A021], [A022], [A025] -->
  <div id="books-panel" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center p-0 sm:p-4 z-40 select-text backdrop-blur-xs">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-xl p-5 shadow-2xl max-h-[85vh] flex flex-col space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <div class="flex items-center space-x-2">
          <h3 class="font-bold text-lg text-gray-800">📖 Mes Livres</h3>
          <span id="modal-books-count-badge" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full font-bold leading-none flex items-center justify-center">0</span>
        </div>
        <button onclick="closeBooksPanel()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold px-2">&times;</button>
      </div>

      <!-- [A020] Filtres de statut supprimés, seul le filtre de langue est conservé -->
      <div class="border-b pb-3">
        <div class="flex items-center space-x-2 text-xs">
          <span class="text-gray-400 font-medium shrink-0">🌐 Langue :</span>
          <select id="filter-book-language" onchange="filterBooksLanguage(this.value)" class="w-full bg-gray-50 border border-gray-200 text-gray-700 py-1 px-2 rounded-lg outline-none focus:ring-1 focus:ring-indigo-500">
            <option value="all">Toutes les langues</option>
            <option value="Français">Français</option>
            <option value="Italien">Italien</option>
            <option value="Anglais">Anglais</option>
          </select>
        </div>
      </div>

      <div id="books-list" class="overflow-y-auto space-y-2.5 pr-1 flex-1"></div>
    </div>
  </div>

  <!-- Modal d'édition des données du jour -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 select-text backdrop-blur-xs">
    <div class="bg-white w-full max-w-sm rounded-xl p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="modal-date" class="font-bold text-gray-700">Détails du jour</h3>
        <button onclick="closeModal()" class="text-gray-400 text-xl font-bold">&times;</button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Objectif 30 pages</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setStatus('success')" id="btn-success" class="p-3 border rounded-lg text-lg flex items-center justify-center hover:bg-emerald-50 transition">✅</button>
          <button onclick="setStatus('fail')" id="btn-fail" class="p-3 border rounded-lg text-lg flex items-center justify-center hover:bg-rose-50 transition">❌</button>
          <button onclick="setStatus(null)" id="btn-none" class="p-3 border rounded-lg text-xs text-gray-500 flex items-center justify-center border-dashed transition">Effacer</button>
        </div>
      </div>

      <div class="space-y-3 border-t pt-3">
        <label class="block text-xs font-semibold text-gray-500 uppercase">Événement Livre</label>
        
        <div class="flex items-center space-x-4">
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" id="input-start" class="w-4 h-4 text-indigo-600 rounded">
            <span>Début <code>{</code></span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" id="input-end" onchange="handleEndToggle(this.checked)" class="w-4 h-4 text-indigo-600 rounded">
            <span>Fin <code>}</code></span>
          </label>
        </div>

        <div class="space-y-2">
          <input type="text" id="input-title" placeholder="Titre du livre" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          <input type="text" id="input-author" placeholder="Auteur" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          
          <div class="grid grid-cols-2 gap-2">
            <select id="input-language" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="">Langue</option>
              <option value="Français">Français</option>
              <option value="Italien">Italien</option>
              <option value="Anglais">Anglais</option>
            </select>
            <input type="number" id="input-pages" placeholder="Nb de pages" min="1" class="w-full text-sm border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="saveDayData()" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition active:scale-[0.98]">Enregistrer</button>
      </div>
    </div>
  </div>

</body>
</html>
